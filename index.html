  },

  /* ---------- Partículas (un solo sistema con tamaño fijo) ---------- */
  crearParticulas() {
    const N = 360;
    const c = document.createElement('canvas');
    c.width = c.height = 32;
    const g = c.getContext('2d'), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(.4, '#ffffffaa'); gr.addColorStop(1, '#ffffff00');
    g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
    const geo = new THREE.BufferGeometry();
    this.part = { N, sig: 0, pos: new Float32Array(N * 3).fill(-999), col: new Float32Array(N * 3), base: new Float32Array(N * 3), vel: new Float32Array(N * 3), vida: new Float32Array(N), max: new Float32Array(N).fill(1) };
    geo.setAttribute('position', new THREE.BufferAttribute(this.part.pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(this.part.col, 3));
    this.puntos = new THREE.Points(geo, new THREE.PointsMaterial({ size: .34, map: new THREE.CanvasTexture(c), vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    this.puntos.frustumCulled = false;
    this.escena.add(this.puntos);
  },
  emitir(pos, n, colores, { rapidez = 4, vida = .9, dir = null } = {}) {
    const P = this.part, col = new THREE.Color();
    for (let k = 0; k < n; k++) {
      const i = P.sig++ % P.N;
      P.pos[i * 3] = pos.x; P.pos[i * 3 + 1] = pos.y; P.pos[i * 3 + 2] = pos.z;
      if (dir) {
        P.vel[i * 3] = dir.x + (Math.random() - .5) * .4; P.vel[i * 3 + 1] = dir.y + (Math.random() - .5) * .4; P.vel[i * 3 + 2] = dir.z;
      } else {
        const v = V3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize().multiplyScalar(rapidez * (.4 + Math.random() * .6));
        P.vel[i * 3] = v.x; P.vel[i * 3 + 1] = v.y; P.vel[i * 3 + 2] = v.z;
      }
      col.set(colores[Math.floor(Math.random() * colores.length)]);
      P.base[i * 3] = col.r; P.base[i * 3 + 1] = col.g; P.base[i * 3 + 2] = col.b;
      P.vida[i] = P.max[i] = vida * (.7 + Math.random() * .3);
    }
  },
  moverParticulas(dt) {
    const P = this.part, freno = 1 - 2.2 * dt;
    for (let i = 0; i < P.N; i++) {
      if (P.vida[i] <= 0) continue;
      P.vida[i] -= dt;
      const j = i * 3;
      if (P.vida[i] <= 0) { P.pos[j + 1] = -999; P.col[j] = P.col[j + 1] = P.col[j + 2] = 0; continue; }
      P.vel[j] *= freno; P.vel[j + 1] *= freno; P.vel[j + 2] *= freno;
      P.pos[j] += P.vel[j] * dt; P.pos[j + 1] += P.vel[j + 1] * dt; P.pos[j + 2] += P.vel[j + 2] * dt;
      const k = P.vida[i] / P.max[i];
      P.col[j] = P.base[j] * k; P.col[j + 1] = P.base[j + 1] * k; P.col[j + 2] = P.base[j + 2] * k;
    }
    this.puntos.geometry.attributes.position.needsUpdate = true;
    this.puntos.geometry.attributes.color.needsUpdate = true;
  },

  /* ---------- Jefes ---------- */
  crearJefe(id) {
    const g = new THREE.Group(), cuerpo = new THREE.Group();
    g.add(cuerpo);
    let cara, mats = [];
    const esfera = (r, color, x, y, z, k = 1.05) => {
      const m = this.matUnico(color);
      mats.push(m);
      const e = this.malla(new THREE.SphereGeometry(r, 20, 14), m, k);
      e.position.set(x, y, z);
      cuerpo.add(e);
      return e;
    };
    if (id === 'copion') {
      const m = this.matUnico('#86e6a8', { opacidad: .95 });
      const gota = this.malla(new THREE.SphereGeometry(1, 24, 18), m);
      const punta = this.malla(new THREE.ConeGeometry(.66, 1.1, 24), m);
      punta.position.y = .95;
      const charco = this.malla(new THREE.CylinderGeometry(1.4, 1.4, .12, 24), this.mat('#6fd393'));
      charco.position.y = -.95;
      cuerpo.add(gota, punta, charco);
      cara = this.crearCara({ sep: .36, y: .05, z: .95, r: .25 });
    } else if (id === 'reves') {
      const izq = this.malla(new THREE.SphereGeometry(1.1, 24, 16, 0, Math.PI), this.mat('#ffb057'));
      const der = this.malla(new THREE.SphereGeometry(1.1, 24, 16, Math.PI, Math.PI), this.mat('#7cc0ff'));
      cuerpo.add(izq, der);
      cara = this.crearCara({ sep: .38, y: -.1, z: 1.05, r: .25 });
      cara.rotation.z = Math.PI; // cara al revés
    } else if (id === 'borron') {
      [[1, 0, 0, 0], [.45, -.8, .5, 0], [.4, .8, .55, 0], [.45, .85, -.5, 0], [.4, -.8, -.55, 0], [.35, 0, .95, 0]].forEach(([r, x, y, z]) => esfera(r, '#2d2f5e', x, y, z));
      for (const x of [-.4, .35]) {
        const gota = this.malla(new THREE.CylinderGeometry(.13, .13, .9, 8), mats[0]);
        gota.position.set(x, -1.1, .2);
        cuerpo.add(gota);
      }
      const nariz = this.malla(new THREE.SphereGeometry(.17, 12, 8), this.mat('#ff6b7a'));
      nariz.position.set(0, -.15, 1.02);
      cuerpo.add(nariz);
      cara = this.crearCara({ sep: .38, y: .2, z: .95, r: .26 });
    } else if (id === 'enredo') {
      const nudo = new THREE.Mesh(new THREE.TorusKnotGeometry(.75, .26, 90, 12), this.mat('#e8457a'));
      const hilo = new THREE.Mesh(new THREE.TorusKnotGeometry(.78, .08, 90, 6, 3, 5), this.mat('#ffd23f'));
      const parche = this.malla(new THREE.CircleGeometry(.75, 24), this.mat('#f7a3bf'), 1.05);
      parche.position.z = 1.0;
      cuerpo.add(nudo, hilo, parche);
      cara = this.crearCara({ sep: .3, y: .1, z: 1.1, r: .22 });
    } else {
      [[1.05, 0, .55, 0], [.9, -.95, .05, 0], [.9, .95, .05, 0], [1.25, 0, -.45, 0], [.7, -1.5, -.7, 0], [.7, 1.5, -.7, 0], [.7, -.65, -1.3, 0], [.7, .65, -1.3, 0]]
        .forEach(([r, x, y, z]) => esfera(r, '#a9a4b8', x, y, z, 1.04));
      cara = this.crearCara({ sep: .48, y: .1, z: 1.3, r: .32 });
    }
    g.add(cara);
    g.userData = { cuerpo, cara, mats, id };
    return g;
  },
  async mostrarJefe(id) {
    if (this.jefe) this.quitar(this.jefe);
    const j = this.crearJefe(id);
    j.scale.setScalar(id === 'nebu' ? 3.3 : 2.7);
    this.jefeBase = V3(0, id === 'nebu' ? 9.2 : 8.6, id === 'nebu' ? -34 : -30);
    j.position.set(0, 22, this.jefeBase.z);
    this.escena.add(j);
    this.jefe = j;
    if (id === 'nebu') this.colorNebu(0);
    const y0 = 22;
    this.jefeEntrando = true;
    await this.animar(900, (t) => { j.position.y = y0 + (this.jefeBase.y - y0) * t; }, (x) => 1 - (1 - x) ** 3);
    this.jefeEntrando = false;
  },
  colorNebu(avance) {
    if (!this.jefe || this.jefe.userData.id !== 'nebu') return;
    const colores = ['#ffd6f0', '#e2a8ff', '#b9c4ff', '#ffb3d9', '#c8a8ff', '#ffc8e8', '#a8c8ff', '#f0b8ff'];
    const gris = new THREE.Color('#a9a4b8');
    this.jefe.userData.mats.forEach((m, i) => m.color.copy(gris).lerp(new THREE.Color(colores[i % colores.length]), avance));
  },
  golpearJefe(avance) {
    const j = this.jefe;
    if (!j) return;
    const pos = j.position.clone();
    this.emitir(pos, 30, ['#ffd23f', '#ff7aa8', '#7ff6ff'], { rapidez: 7, vida: 1 });
    this.onda(pos, '#ffd6f0');
    if (j.userData.id === 'nebu') { Sonido.efecto('hipo'); this.colorNebu(avance); } else Sonido.efecto('golpe');
    const s0 = j.scale.x;
    this.animar(380, (t) => j.scale.setScalar(s0 * (1 + Math.sin(t * Math.PI) * .18)));
  },
  burlaJefe() {
    const j = this.jefe;
    if (!j) return;
    this.animar(700, (t) => { j.userData.cuerpo.rotation.z = Math.sin(t * Math.PI * 4) * .25 * (1 - t); });
  },
  async vencerJefe() {
    const j = this.jefe;
    if (!j) return;
    const s0 = j.scale.x, pos = j.position.clone();
    Sonido.efecto('estrella');
    await this.animar(900, (t) => { j.rotation.y = t * Math.PI * 4; j.scale.setScalar(s0 * (1 - t * .85)); });
    this.emitir(pos, 60, ['#ff7aa8', '#ffd23f', '#7ff6ff', '#b07cff', '#7fdca2'], { rapidez: 8, vida: 1.4 });
    this.onda(pos);
    if (j.userData.id !== 'nebu') { this.quitar(j); this.jefe = null; }
    else this.animar(600, (t) => j.scale.setScalar(s0 * (.15 + t * .85)));
  },

  /* ---------- Bucle principal ---------- */
  medirFps(dt) {
    this.fps.n++; this.fps.t += dt;
    if (this.fps.t < 2) return;
    const fps = this.fps.n / this.fps.t;
    this.fps.n = 0; this.fps.t = 0;
    if (fps < 40 && this.pr > 1) { this.pr = 1; this.renderer.setPixelRatio(1); this.ajustar(); }
    this.calidadBaja = fps < 32;
  },
  moverOpcion(a, dt, t) {
    const vel = this.velFactor;
    if (a.estado === 'llegando') {
      a.t += dt / a.dur;
      const k = THREE.MathUtils.clamp(a.t, 0, 1), e = 1 - (1 - k) ** 3;
      a.grupo.position.lerpVectors(a.desde, a.hasta, e);
      if (a.t > .55) a.div.classList.remove('apagada');
      if (a.t >= 1) { a.estado = 'flotando'; a.tf = 0; }
    } else if (a.estado === 'flotando' || a.estado === 'resaltado') {
      a.tf = (a.tf ?? 0) + dt;
      a.grupo.position.set(a.hasta.x + Math.sin(t * .7 + a.fase) * .12, a.hasta.y + Math.sin(t * 1.3 + a.fase) * .15, a.hasta.z);
      if (a.estado === 'resaltado') a.grupo.scale.setScalar(1 + Math.sin(t * 3) * .08);
      if (a.estado === 'flotando' && this.vueltas && !a.esPortal && a.tf > 8 / vel) a.estado = 'pasando';
    } else if (a.estado === 'pasando') {
      a.grupo.position.z += dt * 8 * vel;
      a.grupo.position.x *= 1 + dt * .5;
      if (a.grupo.position.z > -4) a.div.classList.add('apagada');
      if (a.grupo.position.z > 8) {
        a.desde = V3(a.hasta.x * 2, a.hasta.y + 3, -72);
        a.grupo.position.copy(a.desde);
        a.t = 0;
        a.estado = 'llegando';
      }
    }
    if (a.roca) { a.roca.rotation.x += dt * a.rot.x; a.roca.rotation.y += dt * a.rot.y; }
    if (a.remolino) a.remolino.rotation.z -= dt * 1.5;
  },
  cuadro() {
    const dt = Math.min(this.reloj.getDelta(), .05), t = this.reloj.elapsedTime;
    this.medirFps(dt);
    const lento = this.pausado ? .25 : 1;
    const arr = this.estrellas.geometry.attributes.position.array, v = this.velEstrellas * dt * lento;
    for (let i = 2; i < arr.length; i += 3) { arr[i] += v; if (arr[i] > 6) arr[i] -= 106; }
    this.estrellas.geometry.attributes.position.needsUpdate = true;
    this.planeta.rotation.y += dt * .05;
    this.nebulosa.rotation.z += dt * .01;
    if (this.modo === 'inicio') this.nave.rotation.y += dt * .4;
    else this.nave.rotation.z *= 1 - Math.min(1, 3 * dt);
    this.nave.position.y = this.naveY + Math.sin(t * 2) * .07;
    this.llama.scale.set(1, 1 + Math.sin(t * 8) * .12, 1);
    if ((this.modo === 'vuelo' || this.modo === 'estacion') && !this.pausado && (!this.calidadBaja || Math.floor(t * 60) % 2)) {
      const cola = V3(0, 0, 1.3).applyQuaternion(this.nave.quaternion).multiplyScalar(this.nave.scale.x);
      this.emitir(this.nave.position.clone().add(cola), 1, this.coloresEstela ?? ESTELAS[0].colores, { vida: .35, dir: cola.clone().normalize().multiplyScalar(3) });
    }
    if (!this.pausado) this.opciones.forEach((a) => this.moverOpcion(a, dt, t));
    this.opciones.forEach((a) => a.cara?.lookAt(this.camara.position));
    if (this.cometa && !this.pausado) {
      const c = this.cometa;
      c.t = Math.min(1, c.t + dt / c.dur);
      c.grupo.position.lerpVectors(c.desde, c.hasta, 1 - (1 - c.t) ** 3);
      c.grupo.position.y += Math.sin(t * 1.4) * .1 * c.t;
    }
    if (this.jefe) {
      const j = this.jefe;
      if (this.jefeBase && !this.jefeEntrando) j.position.y = this.jefeBase.y + Math.sin(t * 1.2) * .3;
      j.userData.cuerpo.rotation.y = Math.sin(t * .8) * .25;
      j.userData.cara.lookAt(this.camara.position);
      if (j.userData.id === 'reves') j.userData.cara.rotateZ(Math.PI);
    }
    if (this.estacion.visible) this.estacion.rotation.y += dt * .12;
    this.moverParticulas(dt);
    const ahora = performance.now();
    this.tweens = this.tweens.filter((tw) => {
      const k = Math.min(1, (ahora - tw.ini) / tw.dur);
      tw.fn(tw.ease(k));
      if (k >= 1) { tw.res(); return false; }
      return true;
    });
    if (this.sacudida > 0) {
      this.camara.position.set(this.camBase.x + (Math.random() - .5) * this.sacudida, this.camBase.y + (Math.random() - .5) * this.sacudida, this.camBase.z);
      this.sacudida = Math.max(0, this.sacudida - dt * 1.2);
    } else this.camara.position.copy(this.camBase);
    this.camara.lookAt(this.mira);
    this.renderer.render(this.escena, this.camara);
    this.css.render(this.escena, this.camara);
  },
};

/* =====================================================================
   13. PREGUNTAS
   Dificultad progresiva: la oleada empieza en nivel 1 y el jefe sube a 2-3.
   ===================================================================== */
const NIVELES = { oleada: [1, 1, 1, 1, 2, 2, 2, 2], jefe: [2, 2, 3, 3, 3, 3], final: [2, 2, 2, 2, 3, 3, 3, 3] };
const Preguntas = {
  lista(tipo) { return { sinonimo: BANCO.sinonimos, antonimo: BANCO.antonimos, oracion: BANCO.oraciones }[tipo] ?? []; },
  buscar(id) {
    for (const t of ['sinonimo', 'antonimo', 'oracion']) {
      const it = this.lista(t).find((x) => x.id === id);
      if (it) return { tipo: t, item: it };
    }
    return null;
  },
  utilizable(tipo, it) {
    if (!it?.correcta || !(it.distractores ?? []).filter(Boolean).length) return false;
    return tipo === 'oracion' ? String(it.texto ?? '').includes('___') : !!it.palabra;
  },
  // Entre los candidatos, elige al azar uno de los que este alumno ha visto menos veces.
  elegir(tipo, nivel, usados) {
    const vistos = Juego.alumno?.vistos ?? {};
    const lista = this.lista(tipo).filter((x) => this.utilizable(tipo, x) && !usados.has(x.id));
    if (!lista.length) return null;
    const menosVisto = (c) => {
      const min = Math.min(...c.map((x) => vistos[x.id] ?? 0));
      const r = c.filter((x) => (vistos[x.id] ?? 0) === min);
      return r[Math.floor(Math.random() * r.length)];
    };
    for (const n of [nivel, nivel + 1, nivel - 1, nivel + 2, nivel - 2]) {
      const c = lista.filter((x) => Number(x.nivel) === n);
      if (c.length) return menosVisto(c);
    }
    return menosVisto(lista);
  },
  armar(n, fase) {
    const P = PLANETAS[n], usados = new Set(), niveles = NIVELES[n === 5 ? 'final' : fase];
    let tipos;
    if (P.tipo === 'mixto') tipos = barajar(['sinonimo', 'antonimo', 'oracion', 'clasificacion', 'sinonimo', 'antonimo', 'oracion', 'clasificacion']);
    else if (P.tipo === 'clasificacion') tipos = barajar(niveles.map((_, i) => (i % 2 ? 'sinonimo' : 'antonimo'))).map((t) => `clasificacion:${t}`);
    else tipos = niveles.map(() => P.tipo);
    const refs = [];
    niveles.forEach((nv, i) => {
      let t = tipos[i];
      if (t === 'clasificacion') t = Math.random() < .5 ? 'clasificacion:sinonimo' : 'clasificacion:antonimo';
      const [tipo, origen] = t.split(':');
      const it = this.elegir(origen ?? tipo, nv, usados);
      if (!it) return;
      usados.add(it.id);
      // Las gemelas se pueden preguntar en los dos sentidos (alegre → contento o contento → alegre).
      refs.push({ tipo, id: it.id, inv: (tipo === 'sinonimo' || tipo === 'clasificacion') && Math.random() < .5 });
    });
    return refs;
  },
  crear(ref) {
    if (ref.tipo === 'clasificacion') {
      const b = this.buscar(ref.id);
      if (!b || b.tipo === 'oracion' || !b.item.palabra || !b.item.correcta) return null;
      const gem = b.tipo === 'sinonimo', par = ref.inv ? [b.item.correcta, b.item.palabra] : [b.item.palabra, b.item.correcta];
      return {
        tipo: 'clasificacion', ref, item: b.item, par, esGemela: gem,
        opciones: [{ texto: 'gemelas', ok: gem }, { texto: 'espejo', ok: !gem }],
        lectura: `¿${par[0]} y ${par[1]} son palabras gemelas o palabras espejo?`,
        clave: `${par[0]} / ${par[1]}`,
      };
    }
    const it = this.lista(ref.tipo).find((x) => x.id === ref.id);
    if (!this.utilizable(ref.tipo, it)) return null;
    // Solo las gemelas se invierten: en los espejos, los distractores «trampa» serían respuestas válidas.
    const inv = ref.tipo === 'sinonimo' && ref.inv;
    const palabra = inv ? it.correcta : it.palabra, respuesta = inv ? it.palabra : it.correcta;
    const nDis = ref.tipo === 'oracion' ? 2 : (Number(it.nivel) <= 1 ? 2 : 3);
    const dis = barajar([...new Set(it.distractores.filter((d) => d && normalizar(d) !== normalizar(respuesta) && normalizar(d) !== normalizar(palabra ?? '')))]).slice(0, nDis);
    const opciones = barajar([{ texto: respuesta, ok: true }, ...dis.map((d) => ({ texto: d, ok: false }))]);
    const lectura = {
      sinonimo: `¿Cuál es la palabra gemela de ${palabra}?`,
      antonimo: `¿Cuál es la palabra espejo de ${palabra}?`,
      oracion: `Completa la oración: ${String(it.texto).replace('___', '...')}`,
    }[ref.tipo];
    return { tipo: ref.tipo, ref, item: it, palabra, respuesta, opciones, lectura, clave: ref.tipo === 'oracion' ? it.correcta : it.palabra };
  },
  explicacion(p) {
    const ej = (e) => (e ? ` Por ejemplo: «${e}»` : '');
    const it = p.item;
    let texto;
    if (p.tipo === 'sinonimo') texto = `¡Casi! La gemela de ${mayus(p.palabra)} es ${mayus(p.respuesta)}: significan lo mismo.${ej(it.ejemplo)}`;
    if (p.tipo === 'antonimo') texto = `¡Casi! El espejo de ${mayus(p.palabra)} es ${mayus(p.respuesta)}: significan lo contrario.${ej(it.ejemplo)}`;
    if (p.tipo === 'oracion') texto = `¡Casi! La palabra que encaja es ${mayus(it.correcta)}: «${String(it.texto).replace('___', it.correcta)}»`;
    if (p.tipo === 'clasificacion') {
      texto = p.esGemela
        ? `¡Casi! ${mayus(p.par[0])} y ${mayus(p.par[1])} son gemelas: significan lo mismo.${ej(it.ejemplo)}`
        : `¡Casi! ${mayus(p.par[0])} y ${mayus(p.par[1])} son espejo: significan lo contrario.${ej(it.ejemplo)}`;
    }
    return [{ quien: 'robi', expr: 'pensativo', texto }, { quien: 'robi', expr: 'feliz', texto: 'Esa palabra volverá más adelante. ¡Tú puedes!' }];
  },
};

/* =====================================================================
   14. JUEGO (ruta de la misión, planetas, jefes, energía)
   ===================================================================== */
const RUTA = [
  { tipo: 'escena', id: 'prologo' },
  { tipo: 'planeta', n: 1 }, { tipo: 'estacion', n: 1 },
  { tipo: 'planeta', n: 2 }, { tipo: 'estacion', n: 2 },
  { tipo: 'planeta', n: 3 }, { tipo: 'estacion', n: 3 },
  { tipo: 'planeta', n: 4 }, { tipo: 'estacion', n: 4 },
  { tipo: 'planeta', n: 5 }, { tipo: 'final' },
];

const Juego = {
  alumno: null, prog: null, n: 0, practica: false, nuevasInsignias: [],
  guardar() {
    if (!this.alumno) return;
    this.alumno.ultimaSesion = Date.now();
    Alumnos.guardar(this.alumno);
  },
  actualizarCtx() {
    const a = this.alumno;
    Dialogo.ctx = { nombre: a.nombre, avatar: a.avatar, accesorio: a.robiAccesorio };
  },
  async entrar(alumno) {
    // Datos agregados en versiones nuevas (las partidas guardadas antes no los tienen).
    alumno.vistos ??= {};
    alumno.rescatadas ??= [];
    alumno.nave.estela ??= 'fuego';
    this.alumno = alumno;
    this.actualizarCtx();
    Motor.pintarNave(alumno.nave);
    UI.cerrar();
    if (alumno.terminado) { await Menu.terminado(); return; }
    if (alumno.paso > 0 || alumno.progreso) { Motor.modoEstacion(); await escena('continuar'); }
    else if (await Tutorial.preguntar()) await Tutorial.correr();
    await this.correr();
    await Diploma.mostrar(this.alumno);
    await Menu.terminado();
  },
  async correr() {
    const a = this.alumno;
    while (a.paso < RUTA.length) {
      const e = RUTA[a.paso];
      if (e.tipo === 'escena') { Motor.modoEstacion(); Sonido.musica('estacion'); await escena(e.id); }
      if (e.tipo === 'planeta') await this.planeta(e.n);
      if (e.tipo === 'estacion') await Estacion.correr(e.n);
      if (e.tipo === 'final') await this.final();
      a.paso++;
      this.guardar();
    }
    a.terminado = true;
    this.guardar();
  },
  meta() { return this.n === 5 ? CONFIG.preguntasFinal : CONFIG.preguntasJefe; },
  avance() {
    const p = this.prog;
    if (!p) return 1;
    if (p.fase === 'oleada') return .5 * p.i / Math.max(1, p.cola.length);
    if (p.fase === 'jefe-intro') return .5;
    return .5 + .5 * Math.min(1, p.golpes / this.meta());
  },
  barraJefe() {
    const id = PLANETAS[this.n].jefe;
    HUD.jefe(id, 1 - this.prog.golpes / this.meta(), this.n === 5 ? 'Panza llena' : PERSONAJES[id].nombre);
  },
  async planeta(n, { practica = false } = {}) {
    const a = this.alumno, P = PLANETAS[n];
    this.practica = practica;
    this.n = n;
    this.nuevasInsignias = [];
    let prog = !practica && a.progreso?.n === n ? a.progreso : null;
    const nuevo = !prog;
    if (nuevo) {
      prog = {
        n, fase: n === 5 ? 'jefe-intro' : 'oleada', cola: n === 5 ? [] : Preguntas.armar(n, 'oleada'), i: 0,
        aciertos: 0, errores: 0, golpes: 0, escaneres: CONFIG.escaneresPorPlaneta, usoEscaner: false, reintentos: {}, mitad: false,
      };
      if (!practica) a.progreso = prog;
      a.energia = CONFIG.energiaMax;
      this.guardar();
    }
    this.prog = prog;
    Motor.modoVuelo(n, this.avance());
    Sonido.musica('espacio');
    HUD.mostrar(true);
    HUD.corazones(a.energia);
    HUD.progreso(a);
    HUD.escaner(prog.escaneres, false);
    HUD.reparar(false);
    if (nuevo && !practica && n !== 5) await escena(`llegada${n}`);
    if (prog.fase === 'oleada') {
      await this.fase('oleada');
      prog.fase = 'jefe-intro';
      this.guardar();
    }
    if (prog.fase === 'jefe-intro') {
      HUD.ocultarObjetivo();
      await Motor.mostrarJefe(P.jefe);
      if (!practica) await escena(n === 5 ? 'llegada5' : `jefe${n}`);
      prog.fase = 'jefe';
      prog.cola = Preguntas.armar(n, 'jefe');
      prog.i = 0;
      prog.golpes = 0;
      this.guardar();
    }
    if (prog.fase === 'jefe') {
      if (!Motor.jefe) { await Motor.mostrarJefe(P.jefe); Motor.colorNebu(prog.golpes / this.meta()); }
      Sonido.musica('jefe');
      this.barraJefe();
      await this.fase('jefe');
      HUD.ocultarJefe();
      HUD.ocultarObjetivo();
      await Motor.vencerJefe();
    }
    const total = prog.aciertos + prog.errores;
    const precision = total ? prog.aciertos / total : 1;
    const estrellas = precision >= .9 ? 3 : precision >= .7 ? 2 : 1;
    a.planetas[n] = { completado: true, estrellas: Math.max(estrellas, a.planetas[n]?.estrellas ?? 0), precision: Math.round(precision * 100), ultima: estrellas };
    if (!prog.usoEscaner) this.insignia('sinPistas');
    if (n === 2 && estrellas === 3) this.insignia('maestroEspejos');
    if (!practica) {
      a.progreso = null;
      if (P.llave && !a.llaves.includes(P.llave)) a.llaves.push(P.llave);
    }
    this.guardar();
    this.resultado = { n, estrellas, precision, insignias: [...this.nuevasInsignias] };
    if (!practica && n !== 5) {
      await escena(`victoria${n}`);
      await this.mostrarLlave(P.llave);
    }
    HUD.mostrar(false);
    return this.resultado;
  },
  async fase(tipoFase) {
    const prog = this.prog, n = this.n, meta = this.meta();
    for (;;) {
      if (tipoFase === 'oleada' && prog.i >= prog.cola.length) break;
      if (tipoFase === 'jefe' && prog.golpes >= meta) break;
      if (prog.i >= prog.cola.length) prog.cola.push(...Preguntas.armar(n, 'jefe'));
      const ref = prog.cola[prog.i];
      const preg = Preguntas.crear(ref);
      if (!preg) { prog.i++; if (prog.i > 200) break; continue; }
      this.alumno.vistos[ref.id] = (this.alumno.vistos[ref.id] ?? 0) + 1;
      const ok = await this.preguntar(preg, tipoFase);
      this.registrar(preg, ok);
      if (ok) {
        prog.aciertos++;
        if (tipoFase === 'jefe') prog.golpes++;
      } else {
        prog.errores++;
        const k = ref.tipo + ref.id;
        if (!prog.reintentos[k]) { prog.reintentos[k] = 1; prog.cola.splice(Math.min(prog.i + 3, prog.cola.length), 0, ref); }
      }
      prog.i++;
      Motor.colorPlaneta(n, this.avance());
      this.guardar();
      if (tipoFase === 'jefe') this.barraJefe();
      if (n === 5 && tipoFase === 'jefe' && !prog.mitad && prog.golpes >= meta / 2 && prog.golpes < meta) {
        prog.mitad = true;
        this.guardar();
        if (!this.practica) await escena('mitad5');
      }
      if (this.alumno.energia <= 0) await this.recarga();
    }
  },
  preguntar(preg, tipoFase) {
    const a = this.alumno, prog = this.prog, meta = this.meta();
    return new Promise((resolver) => {
      HUD.objetivo(preg);
      const lectura = AJUSTES.modoApoyo && preg.tipo !== 'clasificacion'
        ? `${preg.lectura} Las opciones son: ${preg.opciones.map((o) => o.texto).join(', ')}.` : preg.lectura;
      Voz.auto(lectura, PERSONAJES.robi.voz, { encolar: true });
      Motor.lanzarOpciones(preg);
      HUD.escaner(prog.escaneres, preg.tipo !== 'clasificacion');
      HUD.reparar(a.energia <= 2);
      this.usarEscaner = () => {
        if (prog.escaneres <= 0 || preg.tipo === 'clasificacion' || Motor.bloqueado || Motor.pausado) return;
        const malas = Motor.opciones.filter((o) => !o.op.ok && o.estado !== 'fuera');
        if (malas.length < 1 || Motor.opciones.length <= 2) return;
        Motor.descartar(malas[Math.floor(Math.random() * malas.length)]);
        prog.escaneres--;
        prog.usoEscaner = true;
        HUD.escaner(prog.escaneres, Motor.opciones.length > 2);
        this.guardar();
      };
      Motor.alElegir = async (op) => {
        Motor.bloqueado = true;
        Motor.alElegir = null;
        this.usarEscaner = null;
        HUD.escaner(prog.escaneres, false);
        HUD.reparar(false);
        await Motor.disparar(op.grupo.position.clone());
        if (op.op.ok) {
          const pos = await Motor.acierto(op);
          Motor.volarPalabra(preg.tipo === 'clasificacion' ? `${preg.par[0]} · ${preg.par[1]}` : op.op.texto, pos);
          const pts = (tipoFase === 'jefe' ? 15 : 10) + (a.racha >= 2 ? 5 : 0);
          a.puntos += pts;
          Motor.flotante(`+${pts}`, pos);
          if (tipoFase === 'jefe') Motor.golpearJefe((prog.golpes + 1) / meta);
          Voz.auto(ANIMOS[Math.floor(Math.random() * ANIMOS.length)], PERSONAJES.robi.voz);
          await esperar(700);
        } else {
          await Motor.error(op);
          const buena = Motor.opciones.find((o) => o.op.ok);
          if (buena) Motor.resaltar(buena);
          a.energia = Math.max(0, a.energia - 1);
          HUD.corazones(a.energia, true);
          Sonido.efecto('corazon');
          if (tipoFase === 'jefe') Motor.burlaJefe();
          await escena(Preguntas.explicacion(preg));
        }
        HUD.ocultarObjetivo();
        await Motor.quitarOpciones(true);
        Motor.bloqueado = false;
        resolver(op.op.ok);
      };
    });
  },
  registrar(preg, ok) {
    const a = this.alumno;
    a.stats[preg.tipo][ok ? 'a' : 'e']++;
    if (ok) {
      a.racha++;
      a.mejorRacha = Math.max(a.mejorRacha, a.racha);
      if (a.racha >= 5) this.insignia('racha5');
      const w = preg.tipo === 'clasificacion' ? `${preg.par[0]} · ${preg.par[1]}` : preg.opciones.find((o) => o.ok).texto;
      if (!a.palabras.includes(w)) a.palabras.push(w);
      if (!a.rescatadas.includes(preg.item.id)) a.rescatadas.push(preg.item.id);
    } else {
      a.racha = 0;
      a.fallos[preg.clave] = (a.fallos[preg.clave] ?? 0) + 1;
    }
    HUD.progreso(a);
  },
  insignia(id) {
    const a = this.alumno;
    if (a.insignias.includes(id)) return;
    a.insignias.push(id);
    this.nuevasInsignias.push(id);
    Sonido.efecto('insignia');
    UI.aviso(`${insigniaSVG(id)}<span>¡Nueva insignia: ${esc(INSIGNIAS[id].nombre)}!</span>`, 3000);
    this.guardar();
  },
  async recarga() {
    const a = this.alumno, n = this.n;
    HUD.mostrar(false);
    await escena('recarga');
    Motor.modoEstacion();
    Sonido.musica('estacion');
    await Reparar.jugar('recarga');
    a.energia = CONFIG.energiaMax;
    Sonido.efecto('recarga');
    this.guardar();
    await escena('recargada');
    Motor.modoVuelo(n, this.avance());
    Sonido.musica(this.prog.fase === 'jefe' ? 'jefe' : 'espacio');
    HUD.mostrar(true);
    HUD.corazones(a.energia);
    HUD.progreso(a);
    if (this.prog.fase === 'jefe') {
      await Motor.mostrarJefe(PLANETAS[n].jefe);
      Motor.colorNebu(this.prog.golpes / this.meta());
      this.barraJefe();
    }
  },
  async repararDesdeHud() {
    const a = this.alumno;
    if (!a || Motor.bloqueado || Motor.pausado || a.energia > 2) return;
    Motor.pausar(true);
    Voz.callar();
    await Reparar.jugar('hud');
    a.energia = Math.min(CONFIG.energiaMax, a.energia + 2);
    Sonido.efecto('recarga');
    HUD.corazones(a.energia);
    HUD.reparar(a.energia <= 2);
    this.guardar();
    Motor.pausar(false);
  },
  async mostrarLlave(id) {
    if (!id) return;
    const L = LLAVES[id];
    Sonido.efecto('llave');
    const el = UI.pantalla(`<div class="caja tarjeta" style="width:min(520px,100%)">
      <div style="width:150px;margin:0 auto">${llaveSVG(L.color)}</div>
      <h2>¡Conseguiste la ${esc(L.nombre)}!</h2>
      <p>Llaves: ${this.alumno.llaves.length} de 4</p>
      <div class="fila-botones"><button class="boton-grande principal" data-ok>¡Genial!</button></div></div>`);
    await UI.clic(el, '[data-ok]');
    UI.cerrar();
  },
  async final() {
    Motor.modoVuelo(5, 1);
    if (!Motor.jefe) await Motor.mostrarJefe('nebu');
    Motor.colorNebu(1);
    Sonido.musica('estacion');
    const fiesta = setInterval(() => {
      if (!Motor.pausado) return;
      Motor.emitir(V3((Math.random() - .5) * 14, Math.random() * 6, -16), 26, ['#ff7aa8', '#ffd23f', '#7ff6ff', '#b07cff', '#7fdca2'], { rapidez: 5, vida: 1.2 });
    }, 900);
    await escena('final');
    clearInterval(fiesta);
    Motor.limpiarTodo();
  },
};

/* =====================================================================
   16. MINIJUEGOS: reparar la nave y megáfono estelar
   ===================================================================== */
const Reparar = {
  // Cuatro pares del mismo tipo, sin palabras repetidas ni relacionadas entre sí en el banco.
  elegirPares() {
    const rel = new Map();
    const unir = (x, y) => { x = normalizar(x); y = normalizar(y); if (!rel.has(x)) rel.set(x, new Set()); if (!rel.has(y)) rel.set(y, new Set()); rel.get(x).add(y); rel.get(y).add(x); };
    [...BANCO.sinonimos, ...BANCO.antonimos].forEach((it) => { if (it.palabra && it.correcta) unir(it.palabra, it.correcta); });
    for (const origen of barajar(['sinonimos', 'antonimos'])) {
      const bloqueadas = new Set(), lista = [];
      for (const it of barajar(BANCO[origen].filter((x) => x.palabra && x.correcta))) {
        const w = [normalizar(it.palabra), normalizar(it.correcta)];
        if (w[0] === w[1] || w.some((x) => bloqueadas.has(x))) continue;
        lista.push([it.palabra, it.correcta]);
        w.forEach((x) => { bloqueadas.add(x); (rel.get(x) ?? []).forEach((r) => bloqueadas.add(r)); });
        if (lista.length === 4) break;
      }
      if (lista.length >= 3) return { tipo: origen === 'sinonimos' ? 'gemelas' : 'espejo', lista };
    }
    return null;
  },
  async jugar(modo) {
    const pares = this.elegirPares();
    if (!pares) return;
    const fichas = barajar(pares.lista.flatMap((p, i) => [{ t: p[0], par: i }, { t: p[1], par: i }]));
    const instruccion = pares.tipo === 'gemelas' ? 'Une las palabras gemelas: las que significan lo mismo.' : 'Une las palabras espejo: las que significan lo contrario.';
    const titulo = modo === 'recarga' ? 'Recarga de energía' : 'Reparar la nave';
    const el = UI.pantalla(`<div class="caja tarjeta" style="width:min(820px,100%)">
      <h2>${titulo}</h2>
      <p>${instruccion}</p>
      <div class="energia-nave" aria-label="Piezas reparadas">${pares.lista.map(() => '<i></i>').join('')}</div>
      <div class="reparar-grid">${fichas.map((x, i) => `<button data-i="${i}" aria-pressed="false"${x.t.length > 9 ? ' class="larga"' : ''}>${esc(x.t)}</button>`).join('')}</div>
      <div class="fila-botones" data-fin hidden><button class="boton-grande principal" data-ok>¡Nave reparada! Continuar ▶</button></div>
    </div>`);
    el.querySelectorAll('[data-i]').forEach((b) => leerAlMantener(b, fichas[b.dataset.i].t));
    Voz.auto(instruccion, PERSONAJES.robi.voz, { encolar: true });
    let sel = null, unidas = 0;
    await new Promise((res) => {
      el.addEventListener('click', async (ev) => {
        const b = ev.target.closest('button');
        if (!b) return;
        if (b.matches('[data-ok]')) { Sonido.efecto('click'); res(); return; }
        if (b.dataset.i === undefined || b.classList.contains('unida') || fueLectura(b)) return;
        if (!sel) { sel = b; b.setAttribute('aria-pressed', 'true'); Sonido.efecto('click'); return; }
        if (sel === b) { b.setAttribute('aria-pressed', 'false'); sel = null; return; }
        const x = fichas[sel.dataset.i], y = fichas[b.dataset.i], primera = sel;
        sel = null;
        primera.setAttribute('aria-pressed', 'false');
        if (x.par === y.par) {
          Sonido.efecto('acierto');
          primera.classList.add('unida');
          b.classList.add('unida');
          el.querySelectorAll('.energia-nave i')[unidas++]?.classList.add('llena');
          if (unidas === pares.lista.length) {
            Sonido.efecto('recarga');
            if (Juego.alumno) Juego.insignia('mecanico');
            el.querySelector('[data-fin]').hidden = false;
          }
        } else {
          Sonido.efecto('error');
          [primera, b].forEach((z) => { z.classList.remove('tiembla'); void z.offsetWidth; z.classList.add('tiembla'); });
        }
      });
      if (DEBUG) el.querySelectorAll('[data-i]').forEach((b) => { b.dataset.par = fichas[b.dataset.i].par; });
    });
    UI.cerrar();
  },
};

const Tutorial = {
  async preguntar() {
    Motor.modoEstacion();
    Sonido.musica('estacion');
    const el = UI.pantalla(`<div class="caja tarjeta" style="width:min(560px,100%)">
      <div style="width:150px;margin:0 auto;border:4px solid #3fb6d9;outline:3px solid var(--ciruela);border-radius:16px;overflow:hidden">${retrato('robi', 'feliz', Dialogo.ctx)}</div>
      <h2>¿Quieres jugar el tutorial?</h2>
      <p>ROBI te enseña a jugar en un ratito.</p>
      <div class="fila-botones">
        <button class="boton-grande principal" data-tuto="si" style="min-width:160px">Sí</button>
        <button class="boton-grande" data-tuto="no" style="min-width:160px">No</button>
      </div></div>`);
    Voz.auto('¿Quieres jugar el tutorial?', PERSONAJES.robi.voz);
    const b = await UI.clic(el, '[data-tuto]');
    UI.cerrar();
    return b.dataset.tuto === 'si';
  },
  mano(boton, mantener = false) {
    boton.querySelector('.mano-tuto')?.remove();
    boton.insertAdjacentHTML('beforeend', `<span class="mano-tuto${mantener ? ' mantener' : ''}" aria-hidden="true">👆</span>`);
  },
  // Muestra meteoritos de práctica (sin puntos ni energía) y espera a que el alumno haga lo pedido.
  practica({ palabra, indicacion, opciones, accion }) {
    return new Promise((res) => {
      const preg = { tipo: 'practica', palabra, indicacion, lectura: `${indicacion} ${palabra}.`, opciones: opciones.map((t) => ({ texto: t, ok: accion === 'tocar' && t === palabra })) };
      HUD.objetivo(preg);
      Voz.auto(preg.lectura, PERSONAJES.robi.voz, { encolar: true });
      Motor.lanzarOpciones(preg);
      const objetivo = Motor.opciones.find((a) => a.op.texto === palabra) ?? Motor.opciones[0];
      setTimeout(() => this.mano(objetivo.div, accion === 'escuchar'), RAPIDO ? 50 : 900);
      let seguir = null;
      const terminar = async (a) => {
        document.removeEventListener('palabra-leida', alLeer);
        clearTimeout(this.reloj);
        seguir?.remove();
        Motor.alElegir = null;
        if (a) { Motor.bloqueado = true; await Motor.disparar(a.grupo.position.clone()); await Motor.acierto(a); }
        HUD.ocultarObjetivo();
        await Motor.quitarOpciones(true);
        Motor.bloqueado = false;
        res();
      };
      const alLeer = () => { if (accion === 'escuchar') setTimeout(() => terminar(null), RAPIDO ? 50 : 1200); };
      document.addEventListener('palabra-leida', alLeer);
      Motor.alElegir = (a) => {
        if (accion === 'tocar' && a.op.ok) { terminar(a); return; }
        if (accion === 'tocar') Voz.decir(`Ese dice ${a.op.texto}. Busca ${palabra}.`, PERSONAJES.robi.voz);
        else Voz.decir('Así lo eliges. Para escucharlo, deja el dedo quieto encima un momento.', PERSONAJES.robi.voz);
      };
      // Si le cuesta, aparece un botón para seguir sin quedarse trabado.
      this.reloj = setTimeout(() => {

/* =====================================================================
   16 bis. DICCIONARIO DEL COFRE: las palabras rescatadas, con su oración
   ===================================================================== */
const Diccionario = {
  grupo: 'gemelas',
  entradas(a) {
    const res = { gemelas: [], espejo: [], oraciones: [] };
    (a.rescatadas ?? []).forEach((id) => {
      const b = Preguntas.buscar(id);
      if (!b) return;
      const it = b.item;
      if (b.tipo === 'sinonimo') res.gemelas.push({ titulo: `${it.palabra} = ${it.correcta}`, detalle: it.ejemplo, voz: `${it.palabra} y ${it.correcta} son palabras gemelas: significan lo mismo. ${it.ejemplo ?? ''}` });
      if (b.tipo === 'antonimo') res.espejo.push({ titulo: `${it.palabra} ↔ ${it.correcta}`, detalle: it.ejemplo, voz: `${it.palabra} y ${it.correcta} son palabras espejo: significan lo contrario. ${it.ejemplo ?? ''}` });
      if (b.tipo === 'oracion') { const o = String(it.texto).replace('___', it.correcta); res.oraciones.push({ titulo: it.correcta, detalle: o, voz: o }); }
    });
    Object.values(res).forEach((l) => l.sort((x, y) => x.titulo.localeCompare(y.titulo, 'es')));
    return res;
  },
  async abrir() {
    const a = Juego.alumno;
    if (!a) return;
    const pausaba = Motor.pausado;
    Motor.pausar(true);
    const e = this.entradas(a);
    const total = e.gemelas.length + e.espejo.length + e.oraciones.length;
    const m = html(`<div class="pantalla" style="z-index:45"><div class="caja tarjeta diccionario" role="dialog" aria-label="Mi diccionario de palabras">
      <h2>📖 Mi diccionario</h2>
      <p style="margin:0">Rescataste ${total} ${total === 1 ? 'palabra' : 'palabras'}. Toca 🔊 para escucharlas.</p>
      <div class="pestanas-dicc">
        <button class="chip" data-g="gemelas">${ICONO_GEMELAS.replace('<svg ', '<svg style="width:30px;height:20px;vertical-align:middle" ')} Gemelas · ${e.gemelas.length}</button>
        <button class="chip" data-g="espejo">${ICONO_ESPEJO.replace('<svg ', '<svg style="width:30px;height:20px;vertical-align:middle" ')} Espejo · ${e.espejo.length}</button>
        <button class="chip" data-g="oraciones">Oraciones · ${e.oraciones.length}</button>
      </div>
      <ul></ul>
      <div class="fila-botones"><button class="boton-grande principal" data-cerrar>Cerrar ✕</button></div>
    </div></div>`);
    const lista = m.querySelector('ul');
    const pintar = () => {
      m.querySelectorAll('[data-g]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.g === this.grupo));
      const items = e[this.grupo];
      lista.innerHTML = items.length
        ? items.map((x, i) => `<li><div><b>${esc(x.titulo)}</b>${x.detalle ? `<span>${esc(x.detalle)}</span>` : ''}</div><button data-oir="${i}" aria-label="Escuchar ${esc(x.titulo)}">${ICONO_SONIDO(true)}</button></li>`).join('')
        : '<li class="vacio" style="display:block">Todavía no rescatas palabras de este tipo. ¡Sigue jugando!</li>';
    };
    pintar();
    $('#app').appendChild(m);
    await new Promise((res) => m.addEventListener('click', (ev) => {
      const b = ev.target.closest('button');
      if (!b) return;
      if (b.dataset.g) { Sonido.efecto('click'); this.grupo = b.dataset.g; pintar(); }
      if (b.dataset.oir !== undefined) Voz.decir(e[this.grupo][Number(b.dataset.oir)].voz, PERSONAJES.robi.voz);
      if (b.matches('[data-cerrar]')) { Sonido.efecto('click'); res(); }
    }));
    Voz.callar();
    m.remove();
    Motor.pausar(pausaba);
  },
};

/* =====================================================================
   18. PANEL DOCENTE
   ===================================================================== */
const textoSeguro = (v) => { const s = String(v ?? ''); return /^[=+\-@]/.test(s) ? `'${s}` : s; };
const precisionDe = (a) => {
  const t = Object.values(a.stats ?? {}).reduce((s, x) => ({ a: s.a + (x.a ?? 0), e: s.e + (x.e ?? 0) }), { a: 0, e: 0 });
  return t.a + t.e ? Math.round(t.a / (t.a + t.e) * 100) : '';
};
const masFalladas = (a, k = 3) => Object.entries(a.fallos ?? {}).sort((x, y) => y[1] - x[1]).slice(0, k).map(([w, n]) => `${w} (${n})`).join(', ');
const fechaCorta = (ms) => (ms ? new Date(ms).toLocaleString('es-PE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '');

function filasSalon() {
  const aula = { ie: AJUSTES.ie, docente: AJUSTES.docente, grado: AJUSTES.grado, seccion: AJUSTES.seccion };
  const locales = Alumnos.lista().map((a) => ({ equipo: AJUSTES.equipo || 'Este equipo', aula, alumno: a, local: true }));
  const importados = Object.values(Store.leer(CLAVES.importados, {})).flatMap((d) =>
    (d.alumnos ?? []).map((a) => ({ equipo: d.equipo || 'Sin nombre', aula: d.aula ?? {}, alumno: a, local: false })));
  return [...locales, ...importados];
}

// Excel separa columnas según la configuración regional: con coma decimal usa «;», si no, «,».
function separadorCSV() {
  if (AJUSTES.separador === ';' || AJUSTES.separador === ',') return AJUSTES.separador;
  let decimal = '.';
  try { decimal = new Intl.NumberFormat(navigator.language || 'es-PE').format(1.5).replace(/\d/g, ''); } catch { /* idioma no reconocido */ }
  return decimal === ',' ? ';' : ',';
}
function generarCSV(filas, sep = separadorCSV()) {
  const enc = ['Equipo', 'Institución educativa', 'Grado', 'Sección', 'Docente', 'Alumno', 'Planetas completados', 'Estrellas totales',
    'Estrellas P1', 'Estrellas P2', 'Estrellas P3', 'Estrellas P4', 'Estrellas P5', 'Puntos',
    'Sinónimos aciertos', 'Sinónimos errores', 'Antónimos aciertos', 'Antónimos errores', 'Oraciones aciertos', 'Oraciones errores',
    'Clasificación aciertos', 'Clasificación errores', 'Precisión (%)', 'Palabras más falladas', 'Insignias', 'Tiempo jugado (min)', 'Última sesión', 'Misión terminada'];
  const celda = (v) => { const s = textoSeguro(v); return /[";\n\r,]/.test(s) || s.includes(sep) ? `"${s.replace(/"/g, '""')}"` : s; };
  const filasTxt = filas.map(({ equipo, aula, alumno: a }) => {
    const st = a.stats ?? {}, pl = a.planetas ?? {};
    return [equipo, aula.ie, aula.grado, aula.seccion, aula.docente, a.nombre, planetasCompletados(a), estrellasTotales(a),
      ...[1, 2, 3, 4, 5].map((n) => pl[n]?.estrellas ?? 0), a.puntos ?? 0,
      st.sinonimo?.a ?? 0, st.sinonimo?.e ?? 0, st.antonimo?.a ?? 0, st.antonimo?.e ?? 0,
      st.oracion?.a ?? 0, st.oracion?.e ?? 0, st.clasificacion?.a ?? 0, st.clasificacion?.e ?? 0,
      precisionDe(a), masFalladas(a, 5), (a.insignias ?? []).map((i) => INSIGNIAS[i]?.nombre ?? i).join(', '),
      Math.round((a.tiempoSeg ?? 0) / 60), fechaCorta(a.ultimaSesion), a.terminado ? 'Sí' : 'No'];
  });
  return '﻿' + [enc, ...filasTxt].map((r) => r.map(celda).join(sep)).join('\r\n') + '\r\n';
}

function descargar(nombre, contenido, tipo) {
  const blob = contenido instanceof Blob ? contenido : new Blob([contenido], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nombre;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const sufijoFecha = () => new Date().toISOString().slice(0, 10);
const slug = (s) => normalizar(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'equipo';

const Docente = {
  tab: 'resultados', subBanco: 'sinonimos', borrador: null, mensajes: [],

      if (ev.target.dataset.dis !== undefined) { it.distractores = it.distractores ?? []; it.distractores[Number(ev.target.dataset.dis)] = ev.target.value; }

  validarBanco(b) {
    const errores = [], avisos = [];
    const nombres = { sinonimos: 'Gemelas', antonimos: 'Espejo', oraciones: 'Oraciones' };
    for (const k of ['sinonimos', 'antonimos', 'oraciones']) {
      const vistos = new Map();
      b[k].forEach((it, i) => {
        const fila = `${nombres[k]}, fila ${i + 1}`;
        const dis = (it.distractores ?? []).map((d) => String(d ?? '').trim());
        it.distractores = dis;
        ['palabra', 'texto', 'correcta', 'ejemplo'].forEach((c) => { if (typeof it[c] === 'string') it[c] = it[c].trim(); });
        if (k === 'oraciones' ? !it.texto : !it.palabra) errores.push(`${fila}: falta ${k === 'oraciones' ? 'la oración' : 'la palabra'}.`);
        if (k === 'oraciones' && it.texto && !it.texto.includes('___')) errores.push(`${fila}: la oración necesita ___ donde va la palabra.`);
        if (!it.correcta) errores.push(`${fila}: falta la respuesta correcta.`);
        const nDis = k === 'oraciones' ? 2 : 3;
        if (dis.filter(Boolean).length < nDis) errores.push(`${fila}: faltan distractores (necesita ${nDis}).`);
        const norm = (x) => normalizar(x);
        if (it.correcta && dis.some((d) => d && norm(d) === norm(it.correcta))) errores.push(`${fila}: un distractor es igual a la respuesta correcta.`);
        if (k !== 'oraciones' && it.palabra && (norm(it.palabra) === norm(it.correcta) || dis.some((d) => d && norm(d) === norm(it.palabra)))) errores.push(`${fila}: la palabra se repite entre las opciones.`);
        if (new Set(dis.filter(Boolean).map(norm)).size < dis.filter(Boolean).length) avisos.push(`${fila}: hay distractores repetidos.`);
        const clave = norm(k === 'oraciones' ? it.texto : `${it.palabra}|${it.correcta}`);
        if (vistos.has(clave)) avisos.push(`${fila}: repite la fila ${vistos.get(clave) + 1}.`);
        vistos.set(clave, i);
      });
      if (b[k].length < 14) avisos.push(`${nombres[k]}: hay ${b[k].length} filas. Se recomiendan al menos 14 para que no se repitan en una partida.`);
    }
    // Un distractor no puede ser también respuesta correcta de la misma palabra en otra fila.
    for (const k of ['sinonimos', 'antonimos']) {
      b[k].forEach((it, i) => {
        const otras = b[k].filter((x, j) => j !== i && x.palabra && normalizar(x.palabra) === normalizar(it.palabra ?? '')).map((x) => normalizar(x.correcta ?? ''));
        (it.distractores ?? []).forEach((d) => { if (d && otras.includes(normalizar(d))) errores.push(`${nombres[k]}, fila ${i + 1}: «${d}» también es respuesta correcta de «${it.palabra}» en otra fila.`); });
      });
    }
    return { errores, avisos };
  },
  guardarBanco(textoOk = 'Banco guardado. Las próximas preguntas ya usan estos cambios.') {
    const { errores, avisos } = this.validarBanco(this.borrador);
    if (errores.length) { this.mensajes = errores.slice(0, 8).map((e) => ['error', e]); if (errores.length > 8) this.mensajes.push(['error', `…y ${errores.length - 8} más.`]); this.pintar(); return; }
    BANCO = clonar(this.borrador);
    Store.escribir(CLAVES.banco, BANCO);
    this.mensajes = [['ok', textoOk], ...avisos.slice(0, 5).map((a) => ['adv', a])];
    this.pintar();
  },

    const A = AJUSTES;
    const txt = (id, label, ph = '') => `<label>${label}<input type="text" data-k="${id}" value="${esc(A[id])}" placeholder="${esc(ph)}"></label>`;

      ${txt('grado', 'Grado', '3.er grado')}${txt('seccion', 'Sección', 'A')}
      ${txt('equipo', 'Nombre de este equipo', 'Tablet 07')}
      <label>Clave del panel docente<input type="password" data-k="clave" value="${esc(A.clave)}" minlength="4" autocomplete="new-password"></label>
      <p class="nota">Sonido y ayudas</p>
      ${chk('vozAuto', 'Leer los diálogos en voz alta automáticamente')}
      ${chk('musica', 'Música de fondo')}
      ${chk('aulaSilenciosa', 'Modo aula silenciosa (sin música, efectos suaves y voz solo con el botón)')}
      ${chk('modoApoyo', 'Modo apoyo para todos (ROBI lee las opciones y los meteoritos van más lentos)')}
      <label>Volumen<input type="range" min="0" max="1" step=".1" data-k="volumen" value="${A.volumen}"></label>
      <label>Separador del CSV<select data-k="separador"><option value="auto" ${A.separador !== ';' && A.separador !== ',' ? 'selected' : ''}>Automático (según el idioma del equipo: «${separadorCSV()}»)</option><option value=";" ${A.separador === ';' ? 'selected' : ''}>Punto y coma ( ; )</option><option value="," ${A.separador === ',' ? 'selected' : ''}>Coma ( , )</option></select></label>
      <p class="nota">Si al abrir el CSV todo aparece en una sola columna, cambia el separador y vuelve a descargarlo.</p>
      <div class="fila-botones" style="grid-column:1/-1;justify-content:flex-start"><button class="boton-grande principal" type="submit">Guardar ajustes</button></div>
    </form>`;
    cuerpo.querySelector('form').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const nuevo = { ...AJUSTES };
      cuerpo.querySelectorAll('[data-k]').forEach((x) => {
        const k = x.dataset.k;
        nuevo[k] = x.type === 'checkbox' ? x.checked : x.type === 'range' ? Number(x.value) : x.value.trim();
      });
      if (String(nuevo.clave).length < 4) { this.avisar('error', 'La clave debe tener al menos 4 caracteres.'); return; }
      AJUSTES = nuevo;
      guardarAjustes();
      Sonido.aplicar();
      HUD.sonido();
      this.avisar('ok', 'Ajustes guardados.');
    });
  },
};

/* =====================================================================
   19. DIPLOMA (PNG descargable + imprimir / guardar PDF)
   ===================================================================== */
const Diploma = {
  imagen(svg) {
    return new Promise((res) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => res(null);
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgAutonomo(svg));
    });
  },
  async dibujar(a) {
    try { await document.fonts?.ready; } catch { /* sin fuentes: se usa la del sistema */ }
    const W = 1600, H = 1131, c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    const fuente = (px, peso = 700) => `${peso} ${px}px Andika, system-ui, sans-serif`;
    const redondo = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
    g.fillStyle = '#ffe3ea'; g.fillRect(0, 0, W, H);
    redondo(30, 30, W - 60, H - 60, 40); g.fillStyle = '#fff0f3'; g.fill(); g.lineWidth = 8; g.strokeStyle = LINEA; g.stroke();
    redondo(52, 52, W - 104, H - 104, 30); g.lineWidth = 14; g.strokeStyle = '#f6c1cc'; g.stroke();
    redondo(66, 66, W - 132, H - 132, 24); g.lineWidth = 3; g.strokeStyle = LINEA; g.stroke();
    const estrellaC = (x, y, r, llena) => {
      g.beginPath();
      for (let i = 0; i < 10; i++) { const ang = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; g.lineTo(x + rr * Math.cos(ang), y + rr * Math.sin(ang)); }
      g.closePath(); g.fillStyle = llena ? '#ffd23f' : '#ffffff'; g.fill(); g.lineWidth = 4; g.strokeStyle = LINEA; g.stroke();
    };
    [[120, 120], [W - 120, 120], [120, H - 120], [W - 120, H - 120]].forEach(([x, y]) => estrellaC(x, y, 30, true));
    g.textAlign = 'center';
    g.fillStyle = LINEA; g.font = fuente(78); g.fillText('Diploma de Chaski Estelar', W / 2, 190);
    g.font = fuente(38, 400); g.fillText('Se otorga a', W / 2, 270);
    g.fillStyle = '#d63f7a'; g.font = fuente(100); g.fillText(a.nombre, W / 2, 385);
    g.fillStyle = LINEA; g.font = fuente(36, 400);
    g.fillText('por ayudar a la Nebulosa Muda a hablar y devolver', W / 2, 455);
    g.fillText('las palabras gemelas y espejo a toda la galaxia.', W / 2, 503);
    const total = estrellasTotales(a);
    for (let i = 0; i < 15; i++) estrellaC(W / 2 - 7 * 62 + i * 62, 585, 25, i < total);
    g.fillStyle = LINEA;
    g.font = fuente(34); g.fillText(`${total} de 15 estrellas · ${a.palabras.length} palabras rescatadas · ${a.puntos} puntos`, W / 2, 665);
    const ins = (a.insignias ?? []).map((x) => INSIGNIAS[x]?.nombre).filter(Boolean);
    g.font = fuente(30, 400); g.fillText(ins.length ? `Insignias: ${ins.join(' · ')}` : 'Misión Palabra', W / 2, 720);
    const [av, rb] = await Promise.all([this.imagen(cadete(a.avatar, 'feliz')), this.imagen(robi('feliz', { accesorio: a.robiAccesorio }))]);
    const marco = (img, x) => { if (!img) return; redondo(x, 760, 230, 230, 24); g.save(); g.clip(); g.drawImage(img, x, 760, 230, 230); g.restore(); redondo(x, 760, 230, 230, 24); g.lineWidth = 6; g.strokeStyle = LINEA; g.stroke(); };
    marco(av, 150); marco(rb, W - 380);
    const fecha = new Date().toLocaleDateString('es-PE', { day: 'numeric', month: 'long', year: 'numeric' });
    const lineas = [AJUSTES.ie, [AJUSTES.grado, AJUSTES.seccion && `Sección ${AJUSTES.seccion}`].filter(Boolean).join(' · '), fecha].filter(Boolean);
    g.font = fuente(30, 400); g.fillStyle = LINEA;
    lineas.forEach((t, i) => g.fillText(t, W / 2, 830 + i * 44));
    if (AJUSTES.docente) {
      g.beginPath(); g.moveTo(W / 2 - 220, 975); g.lineTo(W / 2 + 220, 975); g.lineWidth = 3; g.stroke();
      g.font = fuente(28, 400); g.fillText(`Docente: ${AJUSTES.docente}`, W / 2, 1012);
    }
    return c;
  },
  async mostrar(a) {
    Motor.modoEstacion();
    const canvas = await this.dibujar(a);
    const url = canvas.toDataURL('image/png');
    const el = UI.pantalla(`<div class="caja tarjeta" style="width:min(900px,100%)">
      <h2>¡Misión cumplida!</h2>
      <img class="diploma-img" alt="Diploma de Chaski Estelar de ${esc(a.nombre)}" src="${url}">
      <div class="fila-botones">
        <button class="boton" data-r="png">Descargar imagen (PNG)</button>
        <button class="boton" data-r="pdf">Imprimir o guardar PDF</button>
        <button class="boton-grande principal" data-r="ok">Continuar ▶</button>
      </div></div>`);
    for (;;) {
      const b = await UI.clic(el, '[data-r]');
      if (b.dataset.r === 'png') canvas.toBlob((blob) => descargar(`diploma-${slug(a.nombre)}.png`, blob, 'image/png'), 'image/png');
      if (b.dataset.r === 'pdf') { $('#imprimible').innerHTML = `<img alt="" src="${url}">`; setTimeout(() => window.print(), 100); }
      if (b.dataset.r === 'ok') break;
    }
    UI.cerrar();
  },
};

/* =====================================================================
   20. ARRANQUE
   ===================================================================== */
function eventosGlobales() {
  $('#btnEscaner').addEventListener('click', () => Juego.usarEscaner?.());
  $('#btnReparar').addEventListener('click', () => Juego.repararDesdeHud());
  $('#btnMenu').addEventListener('click', () => Menu.pausa());
  $('#cofre').addEventListener('click', () => { if (!Motor.bloqueado && !Dialogo.activo) Diccionario.abrir(); });
  $('#btnDocente').addEventListener('click', () => Docente.abrir());
  ['#btnSonidoHud', '#btnSonidoIni'].forEach((s) => $(s).addEventListener('click', () => {
    AJUSTES.sonido = !AJUSTES.sonido;
    guardarAjustes();
    Sonido.iniciar();
    Sonido.aplicar();
    if (!AJUSTES.sonido) Voz.callar();
    HUD.sonido();
  }));
  document.addEventListener('pointerdown', () => Sonido.iniciar(), { once: true });
  // tiempo jugado (solo con la pestaña visible)
  let cuenta = 0;
  setInterval(() => {
    if (!Juego.alumno || document.hidden || Menu.enInicio) return;
    Juego.alumno.tiempoSeg = (Juego.alumno.tiempoSeg ?? 0) + 5;
    if (++cuenta % 6 === 0) Juego.guardar();
  }, 5000);
  addEventListener('pagehide', () => Juego.guardar());
}

async function arrancar() {
  for (;;) {
    const nombre = await Menu.inicio();
    let a = Alumnos.obtener(nombre);
    if (!a) {
      const avatar = await Menu.crearCadete(nombre);
      a = alumnoNuevo(nombre, avatar);
      Alumnos.guardar(a);
    }
    await Juego.entrar(a);
    Juego.alumno = null;
  }
}

try {
  Voz.iniciar();
  Dialogo.iniciar();
  Motor.iniciar();
  HUD.sonido();
  eventosGlobales();
  if (DEBUG) window.MP = { Juego, Motor, Voz, Diccionario, Alumnos, Docente, Preguntas, Diploma, Reparar, generarCSV, filasSalon, banco: () => BANCO, ajustes: () => AJUSTES };
  arrancar();
} catch (e) {
  UI.pantalla(`<div class="caja tarjeta"><h2>No se pudo iniciar el juego</h2><p>Este equipo no puede mostrar gráficos 3D o el navegador es muy antiguo. Prueba con Chrome actualizado.</p></div>`);
  throw e;
}
</script>
