<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1640">
<title>Misión Palabra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --rosa: #f6c1cc;
    --rosa-claro: #fff0f3;
    --rosa-medio: #f9d3dc;
    --ciruela: #4a2635;
    --ciruela-suave: #7a3b52;
    --texto: #2b1420;
    --verde: #2f9e64;
    --c: #3fb6d9;
    --vn-alto: clamp(150px, 30vh, 240px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #1b1640; color: var(--texto);
    font-family: 'Andika', system-ui, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  input, select, textarea { font: inherit; -webkit-user-select: text; user-select: text; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  #app { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
  #c3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #etiquetas { position: absolute; inset: 0; pointer-events: none; }
  .marco-pantalla {
    position: absolute; inset: 6px; pointer-events: none; z-index: 2;
    border: 7px solid var(--rosa); border-radius: 22px;
    box-shadow: 0 0 0 3px var(--ciruela), inset 0 0 0 3px var(--ciruela);
  }

  /* ---------- Piezas comunes ---------- */
  .caja {
    background: var(--rosa-claro); border: 3px solid var(--ciruela); border-radius: 14px;
    box-shadow: inset 0 0 0 3px var(--rosa);
  }
  .tarjeta {
    width: min(720px, 100%); max-height: calc(100% - 8px); overflow: auto; padding: 24px 26px; text-align: center;
    box-shadow: inset 0 0 0 5px var(--rosa-medio), inset 0 0 0 8px var(--rosa);
  }
  .tarjeta h2 { margin: 0 0 6px; font-size: clamp(26px, 3.4vw, 38px); }
  .tarjeta p { font-size: clamp(18px, 1.6vw + 4px, 22px); margin: 6px 0 16px; }
  .boton-grande {
    min-height: 64px; padding: 10px 30px; font-size: clamp(21px, 1.6vw + 8px, 27px); font-weight: 700;
    background: #fff; border: 3px solid var(--ciruela); border-radius: 18px;
    box-shadow: inset 0 0 0 4px var(--rosa), 0 6px 0 var(--ciruela);
  }
  .boton-grande:active, .boton:active { transform: translateY(3px); box-shadow: inset 0 0 0 4px var(--rosa), 0 2px 0 var(--ciruela); }
  .boton-grande:disabled { opacity: .45; cursor: default; transform: none; }
  .boton-grande.principal { background: #ffd6e0; }
  .boton {
    min-height: 48px; padding: 6px 18px; font-size: 18px; font-weight: 700;
    background: #fff; border: 3px solid var(--ciruela); border-radius: 14px;
    box-shadow: inset 0 0 0 3px var(--rosa), 0 4px 0 var(--ciruela);
  }
  .boton.peligro { background: #ffe0e0; }
  .fila-botones { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 12px; }
  .chip {
    min-height: 44px; padding: 4px 14px; font-weight: 700; font-size: 16px;
    background: #fff; border: 3px solid var(--ciruela); border-radius: 999px;
  }
  .chip[aria-pressed="true"] { background: var(--ciruela); color: #fff; }

  .pantalla {
    position: absolute; inset: 0; z-index: 20; padding: 18px;
    display: grid; place-items: center;
    background: rgba(27, 22, 64, .45);
  }
  .pantalla.transparente { background: transparent; pointer-events: none; }
  .pantalla.transparente > * { pointer-events: auto; }

  /* ---------- HUD ---------- */
  .hud { position: absolute; top: 20px; left: 22px; right: 22px; z-index: 6; display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: start; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .hud-izq, .hud-der { display: flex; flex-direction: column; gap: 8px; }
  .hud-izq { align-items: flex-start; }
  .hud-der { align-items: flex-end; }
  .hud .fila { display: flex; gap: 8px; align-items: center; }
  .corazones { padding: 5px 10px; display: flex; gap: 2px; }
  .corazones svg { width: 30px; height: 30px; }
  .corazones svg.pierde { animation: pierde .6s ease-out; }
  @keyframes pierde { 30% { transform: scale(1.35); } }
  .hud-btn { min-height: 48px; padding: 4px 14px; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
  .hud-btn:disabled { opacity: .45; }
  .hud-btn svg { width: 26px; height: 26px; }
  .hud-btn.redondo { width: 50px; padding: 0; justify-content: center; }
  .hud-btn.aviso { background: #fff3c4; animation: suave 2.4s ease-in-out infinite; }
  @keyframes suave { 50% { transform: scale(1.05); } }
  .galaxia { padding: 5px 12px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
  .galaxia .barra { width: min(200px, 20vw); height: 20px; border: 3px solid var(--ciruela); border-radius: 6px; background: #fff; overflow: hidden; }
  .galaxia .barra i { display: block; height: 100%; width: 0; transition: width .8s; background: repeating-linear-gradient(-45deg, #ff9fb8 0 10px, #ffc2d1 10px 20px); }
  .cofre, .puntos { min-height: 48px; padding: 4px 12px; display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 19px; }
  .cofre svg { width: 30px; height: 30px; }
  .cofre.salta { animation: salta .4s ease-out; }
  @keyframes salta { 40% { transform: scale(1.2); } }

  .objetivo {
    max-width: min(640px, 52vw); padding: 8px 22px 10px; text-align: center;
    box-shadow: inset 0 0 0 5px var(--rosa-medio), inset 0 0 0 8px var(--rosa);
    animation: baja .35s ease-out;
  }
  @keyframes baja { from { opacity: 0; transform: translateY(-14px); } }
  .objetivo small { display: flex; justify-content: center; align-items: center; gap: 8px; font-size: clamp(16px, 1.3vw + 6px, 21px); font-weight: 700; color: var(--ciruela-suave); }
  .objetivo small svg { width: 30px; height: 22px; }
  .objetivo strong { display: block; font-size: clamp(32px, 3vw + 14px, 52px); line-height: 1.1; letter-spacing: .02em; }
  .objetivo .oracion { display: block; font-size: clamp(24px, 1.8vw + 12px, 34px); font-weight: 700; line-height: 1.3; }
  .objetivo .hueco { display: inline-block; min-width: 3.2em; border-bottom: 4px solid var(--ciruela); margin: 0 .15em; }
  .objetivo { position: relative; cursor: pointer; }
  .objetivo .oir { position: absolute; right: -14px; top: -14px; width: 40px; height: 40px; border-radius: 50%; background: #ffd6e0; border: 3px solid var(--ciruela); display: grid; place-items: center; }
  .objetivo .oir svg { width: 24px; height: 24px; }
  .objetivo.gemela { border-color: #c2186b; }
  .objetivo.espejo { border-color: #1f5fa8; }

  .jefe-barra {
    position: absolute; z-index: 6; top: 50%; right: 22px; transform: translateY(-50%);
    width: 64px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .jefe-barra .barra { width: 26px; height: min(280px, 38vh); border: 3px solid var(--ciruela); border-radius: 8px; background: #fff; overflow: hidden; display: flex; align-items: flex-end; }
  .jefe-barra .barra i { display: block; width: 100%; height: 100%; transition: height .7s; background: linear-gradient(#ff7aa8, #b07cff); }
  .jefe-barra .retrato-mini { width: 50px; height: 50px; border-radius: 10px; overflow: hidden; border: 3px solid var(--ciruela); }
  .jefe-barra .retrato-mini svg { width: 100%; height: 100%; display: block; }
  .jefe-barra b { font-size: 14px; text-align: center; line-height: 1.1; }

  /* ---------- Etiquetas sobre asteroides (CSS2D) ---------- */
  .etiqueta {
    pointer-events: auto; cursor: pointer; white-space: nowrap;
    padding: 6px 20px 8px; min-width: 96px; text-align: center;
    font: 700 clamp(28px, 1.6vw + 14px, 38px)/1.1 'Andika', system-ui, sans-serif; color: var(--texto);
    background: #fff; border: 3px solid var(--ciruela); border-radius: 16px;
    box-shadow: inset 0 0 0 4px var(--rosa), 0 5px 0 var(--ciruela);
    transition: opacity .3s, background .3s;
  }
  .etiqueta:active { transform: translateY(3px); }
  .etiqueta.leyendo, .reparar-grid button.leyendo { outline: 5px solid #ffd23f; outline-offset: 2px; }
  .etiqueta.ok { background: #c8f5d8; box-shadow: inset 0 0 0 4px #7fdca2, 0 5px 0 var(--ciruela); }
  .etiqueta.mal { background: #e4e0e8; color: #6d6680; }
  .etiqueta.apagada { opacity: 0; pointer-events: none; }
  .etiqueta.portal { font-size: clamp(26px, 1.4vw + 14px, 34px); display: flex; align-items: center; gap: 10px; }
  .etiqueta.portal svg { width: 40px; height: 28px; }
  .etiqueta.gemelas { background: #ffe0ef; border-color: #a3175c; }
  .etiqueta.espejo { background: #ddeeff; border-color: #1d4f8c; }
  .etiqueta.par { font-size: clamp(30px, 1.8vw + 14px, 42px); background: #fffbe6; pointer-events: none; }

  .flotante { position: absolute; z-index: 8; pointer-events: none; font-weight: 700; font-size: 34px; color: #fff; text-shadow: 0 0 0 #000, 2px 2px 0 var(--ciruela), -2px -2px 0 var(--ciruela), 2px -2px 0 var(--ciruela), -2px 2px 0 var(--ciruela); }
  .palabra-vuela { position: absolute; z-index: 8; pointer-events: none; padding: 4px 14px; font-weight: 700; font-size: 26px; background: #fffbe6; border: 3px solid var(--ciruela); border-radius: 12px; }
  .aviso-toast {
    position: absolute; z-index: 30; left: 50%; top: 92px; transform: translateX(-50%);
    padding: 10px 22px; font-weight: 700; font-size: 21px; display: flex; gap: 12px; align-items: center;
    animation: baja .35s ease-out;
  }
  .aviso-toast svg { width: 44px; height: 44px; }

  /* ---------- Cuadro de novela visual ---------- */
  .vn {
    position: absolute; z-index: 15; left: 50%; bottom: 24px; transform: translateX(-50%);
    width: min(1180px, calc(100% - 56px));
    display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end;
    transition: opacity .25s, transform .25s;
  }
  .vn.oculta { opacity: 0; transform: translate(-50%, 30px); pointer-events: none; }
  .vn-marco { display: grid; grid-template-columns: var(--vn-alto) 1fr; gap: 12px; height: var(--vn-alto); cursor: pointer; }
  .vn-retrato { border: 5px solid var(--c); outline: 3px solid var(--ciruela); border-radius: 16px; overflow: hidden; background: #fff; }
  .vn-retrato svg { width: 100%; height: 100%; display: block; }
  .vn-retrato.entra svg { animation: rebote .35s ease-out; }
  @keyframes rebote { 0% { transform: translateY(8px) scale(.96); } 100% { transform: none; } }
  .vn-cuerpo {
    position: relative; padding: 32px 60px 16px 26px;
    background: var(--rosa-claro); background: color-mix(in srgb, var(--rosa-claro) 96%, transparent);
    border: 3px solid var(--ciruela); border-radius: 16px;
    box-shadow: inset 0 0 0 5px var(--rosa-medio), inset 0 0 0 8px var(--rosa);
  }
  .vn-nombre {
    position: absolute; top: -21px; left: 18px; padding: 2px 18px 2px 12px; font-weight: 700; font-size: clamp(17px, 1.4vw + 4px, 22px);
    background: #fff; border: 3px solid var(--ciruela); border-left: 14px solid var(--c); border-radius: 999px;
  }
  .vn-texto { margin: 0; font-size: clamp(20px, 1.8vw + 6px, 30px); line-height: 1.35; font-weight: 700; }
  .vn-texto .fantasma { visibility: hidden; }
  .vn-sig { position: absolute; right: 22px; bottom: 12px; font-size: 26px; color: var(--ciruela-suave); opacity: 0; }
  .vn-sig.si { opacity: 1; animation: empuje 1.6s ease-in-out infinite; }
  @keyframes empuje { 50% { transform: translateX(6px); } }
  .vn-botones { display: grid; gap: 8px; height: var(--vn-alto); align-content: space-between; }
  .vn-botones button { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: #ffd6e0; border: 3px solid var(--ciruela); box-shadow: inset 0 0 0 3px #fff; }
  .vn-botones button:active { transform: scale(.92); }
  .vn-botones svg { width: 26px; height: 26px; }
  @media (max-height: 640px) { .vn-botones { grid-template-columns: 1fr 1fr; align-content: end; } }
  .vn-opciones { position: absolute; bottom: calc(100% + 20px); left: 0; right: 0; display: flex; justify-content: center; flex-wrap: wrap; gap: 18px; }
  .vn-opciones button {
    min-height: 64px; min-width: 210px; padding: 10px 28px; font-size: clamp(20px, 1.6vw + 6px, 27px); font-weight: 700;
    background: #fff; border: 3px solid var(--ciruela); border-radius: 18px; box-shadow: inset 0 0 0 4px var(--rosa), 0 6px 0 var(--ciruela);
    animation: aparece .3s ease-out;
  }
  @keyframes aparece { from { opacity: 0; transform: translateY(10px); } }
  .historial { width: min(760px, 100%); max-height: 86%; display: flex; flex-direction: column; padding: 18px; }
  .historial header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .historial h2 { margin: 0; font-size: 26px; }
  .historial ol { list-style: none; margin: 0; padding: 0; overflow: auto; display: grid; gap: 10px; }
  .historial li { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; font-size: 19px; }
  .historial li svg { width: 56px; height: 56px; border-radius: 10px; border: 3px solid var(--ciruela); }
  .historial b { display: block; font-size: 16px; color: var(--ciruela-suave); }

  /* ---------- Inicio ---------- */
  .logo { font-size: clamp(38px, 5vw, 60px); margin: 0; line-height: 1; letter-spacing: .01em; }
  .logo span { color: #d63f7a; }
  .form-nombre { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 6px 0 4px; }
  .form-nombre input {
    width: min(360px, 100%); min-height: 60px; padding: 6px 16px; font-size: 26px; font-weight: 700;
    border: 3px solid var(--ciruela); border-radius: 16px; background: #fff;
  }
  .ayuda { font-size: 16px !important; color: var(--ciruela-suave); margin: 4px 0 10px !important; }
  .lista-alumnos { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 8px 0 4px; }
  .lista-alumnos button {
    display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 4px 14px 4px 4px;
    background: #fff; border: 3px solid var(--ciruela); border-radius: 16px; font-weight: 700; font-size: 19px; text-align: left;
  }
  .lista-alumnos button svg { width: 50px; height: 50px; border-radius: 10px; }
  .lista-alumnos small { display: block; font-size: 14px; color: var(--ciruela-suave); }
  .avatares { display: grid; grid-template-columns: repeat(3, minmax(0, 150px)); gap: 14px; justify-content: center; margin: 10px 0; }
  .avatares button { padding: 0; border: 4px solid var(--ciruela); border-radius: 18px; overflow: hidden; background: #fff; aspect-ratio: 1; }
  .avatares button svg { width: 100%; height: 100%; display: block; }
  .avatares button[aria-pressed="true"] { outline: 6px solid #ff8a3d; }
  .btn-docente {
    position: absolute; z-index: 21; left: 22px; bottom: 20px; width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255, 240, 243, .35); border: 2px solid rgba(255, 255, 255, .5); color: #fff; font-size: 20px;
  }
  .btn-sonido-ini { position: absolute; z-index: 21; right: 22px; bottom: 20px; }

  /* ---------- Estación, pausa activa, recompensas ---------- */
  .pasos { display: flex; justify-content: center; gap: 8px; margin-bottom: 8px; }
  .pasos i { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--ciruela); background: #fff; }
  .pasos i.hecho { background: var(--ciruela); }
  .pausa { display: grid; grid-template-columns: minmax(160px, 260px) 1fr; gap: 20px; align-items: center; text-align: left; }
  .pausa .robi-cuerpo { width: 100%; aspect-ratio: 1; }
  .pausa .instruccion { font-size: clamp(24px, 2vw + 10px, 36px); font-weight: 700; margin: 0 0 10px; }
  .reloj { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 700; }
  .reloj svg { width: 70px; height: 70px; }
  .reloj circle.avance { transition: stroke-dashoffset 1s linear; }
  .robi-cuerpo .brazo-i, .robi-cuerpo .brazo-d, .robi-cuerpo .todo, .robi-cuerpo .panza { transform-box: fill-box; }
  .robi-cuerpo .brazo-i { transform-origin: 100% 10%; }
  .robi-cuerpo .brazo-d { transform-origin: 0% 10%; }
  .robi-cuerpo .todo { transform-origin: 50% 50%; }
  .robi-cuerpo .panza { transform-origin: 50% 50%; }
  .ej-antenas .brazo-i { animation: antenaI 3s ease-in-out infinite; }
  .ej-antenas .brazo-d { animation: antenaD 3s ease-in-out infinite; }
  @keyframes antenaI { 50% { transform: rotate(150deg); } }
  @keyframes antenaD { 50% { transform: rotate(-150deg); } }
  .ej-planeta .todo { animation: giro 5s ease-in-out infinite; }
  @keyframes giro { 50% { transform: rotate(18deg); } 100% { transform: rotate(0); } 25% { transform: rotate(-18deg); } }
  .ej-globo .panza { animation: globo 4s ease-in-out infinite; }
  @keyframes globo { 50% { transform: scale(1.25); } }
  .ej-estrellas .brazo-i { animation: sacudeI .8s ease-in-out infinite; }
  .ej-estrellas .brazo-d { animation: sacudeD .8s ease-in-out infinite; }
  @keyframes sacudeI { 50% { transform: rotate(40deg); } }
  @keyframes sacudeD { 50% { transform: rotate(-40deg); } }
  .ej-luna .todo { animation: luna 1.6s ease-in-out infinite; }
  @keyframes luna { 50% { transform: translateY(-8%); } }
  .ej-hombros .brazo-i, .ej-hombros .brazo-d { animation: hombros 1.8s ease-in-out infinite; }
  @keyframes hombros { 50% { transform: translateY(-12%); } }

  .estrellas-grandes { display: flex; justify-content: center; gap: 10px; margin: 4px 0 8px; }
  .estrellas-grandes svg { width: 64px; height: 64px; }
  .estrellas-grandes svg.gana { animation: estrellaGana .6s ease-out both; }
  @keyframes estrellaGana { from { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.2); } }
  .insignias { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 6px 0 12px; }
  .insignia { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border: 3px solid var(--ciruela); border-radius: 999px; background: #fff; font-weight: 700; font-size: 16px; }
  .insignia svg { width: 40px; height: 40px; }
  .insignia.bloqueada { opacity: .4; filter: grayscale(1); }
  .personaliza { display: grid; gap: 10px; text-align: left; margin: 8px 0 4px; }
  .personaliza h3 { margin: 4px 0 0; font-size: 20px; }
  .muestras { display: flex; flex-wrap: wrap; gap: 10px; }
  .muestras button { width: 54px; height: 54px; border-radius: 14px; border: 3px solid var(--ciruela); display: grid; place-items: center; background: #fff; position: relative; }
  .muestras button svg { width: 34px; height: 34px; }
  .muestras button[aria-pressed="true"] { outline: 5px solid #ff8a3d; }
  .muestras button:disabled { opacity: .35; cursor: default; }
  .muestras[data-grupo="robi"] button { width: 72px; height: 72px; padding: 0; overflow: hidden; }
  .muestras[data-grupo="robi"] button svg { width: 100%; height: 100%; }
  .muestras button:disabled::after { content: "🔒"; position: absolute; right: -8px; bottom: -8px; font-size: 18px; }

  /* ---------- Minijuegos ---------- */
  .reparar-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 12px 0; }
  .reparar-grid button {
    min-height: 74px; padding: 6px; font-size: clamp(22px, 1.4vw + 12px, 30px); font-weight: 700;
    background: #fff; border: 3px solid var(--ciruela); border-radius: 16px; box-shadow: inset 0 0 0 4px var(--rosa), 0 5px 0 var(--ciruela);
  }
  .reparar-grid button.larga { font-size: clamp(18px, 1vw + 11px, 25px); }
  .reparar-grid button[aria-pressed="true"] { background: #fff3c4; box-shadow: inset 0 0 0 4px #ffd23f, 0 5px 0 var(--ciruela); }
  .reparar-grid button.unida { visibility: hidden; }
  .reparar-grid button.tiembla { animation: tiembla .4s; }
  @keyframes tiembla { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .energia-nave { display: flex; justify-content: center; gap: 8px; }
  .energia-nave i { width: 34px; height: 18px; border: 3px solid var(--ciruela); border-radius: 5px; background: #fff; }
  .energia-nave i.llena { background: #7fdca2; }
  .megafono { display: grid; grid-template-columns: 1fr; gap: 10px; justify-items: center; }
  .megafono svg.mega { width: min(360px, 70vw); height: auto; }
  .megafono svg.mega.lista { animation: suave 1.4s ease-in-out infinite; }

/* =====================================================================

   Cada retrato se dibuja por capas en un lienzo de 200 × 200 y cambia
   de expresión cambiando solo ojos, cejas y boca.

const LINEA = '#4a2635';
let _uid = 0;
const nid = () => 'k' + (++_uid);
const f = (n) => Math.round(n * 10) / 10;
const T = (w = 2.5, c = LINEA) => `stroke="${c}" stroke-width="${w}"`;

function lienzo(fondo, contenido) {
  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img">`
    + `<rect width="200" height="200" fill="${fondo}"/>`
    + `<circle cx="100" cy="96" r="80" fill="#fff" opacity=".4"/>`
    + `<g filter="url(#trazo)" stroke-linejoin="round">${contenido}</g></svg>`;
}

function ojo(cx, cy, e, lado, o = {}) {
  const s = o.s ?? 1, L = o.linea ?? LINEA;
  const X = (d) => f(cx + d * s), Y = (d) => f(cy + d * s), W = (v) => f(v * s);
  if (e === 'feliz') {
    return `<path d="M${X(-11)} ${Y(4)} Q${X(0)} ${Y(-12)} ${X(11)} ${Y(4)}" fill="none" stroke="${L}" stroke-width="${W(4.5)}" stroke-linecap="round"/>`;
  }
  if (e === 'hipo' || e === 'achis') {
    const k = -lado;
    return `<path d="M${X(-8 * k)} ${Y(-7)} L${X(7 * k)} ${Y(0)} L${X(-8 * k)} ${Y(7)}" fill="none" stroke="${L}" stroke-width="${W(4.5)}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  let rx = 11, ry = 13, irx = 8, iry = 9.5, dx = 0, dy = 1.5;
  if (e === 'sorprendido') { rx = 12.5; ry = 14.5; irx = 5.2; iry = 6.2; dy = 0; }
  if (e === 'pensativo') { dx = 3; dy = -3; }
  if (e === 'triste') { dy = 3; }
  const parpado = (e === 'pensativo' || e === 'presumido') && o.piel;
  const id = nid();
  const ix = cx + dx * s, iy = cy + dy * s;
  let r = `<clipPath id="${id}"><ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${W(rx)}" ry="${W(ry)}"/></clipPath>`;
  r += `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${W(rx)}" ry="${W(ry)}" fill="${o.blanco ?? '#fff'}"/>`;
  r += `<g clip-path="url(#${id})">`;
  r += `<ellipse cx="${f(ix)}" cy="${f(iy)}" rx="${W(irx)}" ry="${W(iry)}" fill="${o.iris ?? '#6b3b2a'}"/>`;
  r += `<ellipse cx="${f(ix)}" cy="${f(iy + s)}" rx="${W(irx * .5)}" ry="${W(iry * .55)}" fill="#1d0f16" opacity=".85"/>`;
  r += `<circle cx="${f(ix - 3 * s)}" cy="${f(iy - 4 * s)}" r="${W(3.2)}" fill="#fff"/>`;
  r += `<circle cx="${f(ix + 3 * s)}" cy="${f(iy + 3.5 * s)}" r="${W(1.6)}" fill="#fff" opacity=".9"/>`;
  if (parpado) r += `<rect x="${X(-rx - 2)}" y="${Y(-ry - 2)}" width="${W(2 * rx + 4)}" height="${W(ry * .95 + 2)}" fill="${o.piel}"/>`;
  r += `</g><ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${W(rx)}" ry="${W(ry)}" fill="none" stroke="${L}" stroke-width="${W(2)}"/>`;
  let a, c, b;
  if (parpado) { const y = -ry * .05; a = [-rx - 1.5, y]; c = [0, y - 4]; b = [rx + 1.5, y]; }
  else if (e === 'triste') { a = [lado * (rx + 1.5), 1]; c = [0, -ry - 6]; b = [-lado * (rx + 1.5), -5]; }
  else { a = [-rx - 1.5, -1]; c = [0, -ry - 7]; b = [rx + 1.5, -2]; }
  r += `<path d="M${X(a[0])} ${Y(a[1])} Q${X(c[0])} ${Y(c[1])} ${X(b[0])} ${Y(b[1])}" fill="none" stroke="${L}" stroke-width="${W(o.pestanas === false ? 2.6 : 4)}" stroke-linecap="round"/>`;
  if (!parpado && o.pestanas !== false) {
    const ox = lado * (rx + 1);
    r += `<path d="M${X(ox)} ${Y(e === 'triste' ? 1 : -2)} l${W(lado * 4)} ${W(-4)}" stroke="${L}" stroke-width="${W(3)}" stroke-linecap="round"/>`;
  }
  if (e === 'triste' && lado === 1) {
    r += `<path d="M${X(rx - 3)} ${Y(ry + 1)} c${W(-3)} ${W(4)} ${W(-4)} ${W(7)} 0 ${W(9)} c${W(4)} ${W(-2)} ${W(3)} ${W(-5)} 0 ${W(-9)} Z" fill="#9fd8ff" stroke="${L}" stroke-width="${W(1.2)}"/>`;
  }
  return r;
}

function ceja(cx, cy, e, lado, o = {}) {
  const s = o.s ?? 1, c = o.color ?? LINEA, g = o.grosor ?? 4;
  const ext = lado * 10, int = -lado * 10;
  let ye = 2, yi = 2, ym = -4, sh = 0;
  switch (e) {
    case 'feliz': sh = -4; break;
    case 'sorprendido': sh = -8; ym = -10; break;
    case 'pensativo': if (lado === -1) { sh = 1; ym = 0; ye = 1; yi = 1; } else { sh = -5; ye = 0; yi = 2; ym = -8; } break;
    case 'triste': ye = 3; yi = -6; ym = -3; sh = -1; break;
    case 'presumido': ye = -3; yi = 5; ym = -2; break;
    case 'hipo': case 'achis': ye = 2; yi = -3; ym = -4; sh = -2; break;
  }
  const P = (x, y) => `${f(cx + x * s)} ${f(cy + (y + sh) * s)}`;
  const d = `M${P(ext, ye)} Q${P(0, ym)} ${P(int, yi)}`;
  let r = '';
  if (o.borde) r += `<path d="${d}" fill="none" stroke="${o.borde}" stroke-width="${f((g + 3) * s)}" stroke-linecap="round"/>`;
  return r + `<path d="${d}" fill="none" stroke="${c}" stroke-width="${f(g * s)}" stroke-linecap="round"/>`;
}

function boca(mx, my, e, o = {}) {
  const s = o.s ?? 1, L = o.linea ?? LINEA, int = o.interior ?? '#8c2f45', len = o.lengua ?? '#ff8fa3';
  const P = (x, y) => `${f(mx + x * s)} ${f(my + y * s)}`, W = (v) => f(v * s);
  const trazo = (d, w = 3) => `<path d="${d}" fill="none" stroke="${L}" stroke-width="${W(w)}" stroke-linecap="round" stroke-linejoin="round"/>`;
  switch (e) {
    case 'feliz':
      return `<path d="M${P(-11, -2)} Q${P(0, 17)} ${P(11, -2)} Z" fill="${int}" stroke="${L}" stroke-width="${W(2.5)}"/>`
        + `<ellipse cx="${f(mx + s)}" cy="${f(my + 5.5 * s)}" rx="${W(5)}" ry="${W(2.6)}" fill="${len}"/>`;
    case 'sorprendido':
      return `<ellipse cx="${f(mx)}" cy="${f(my + 2 * s)}" rx="${W(5.5)}" ry="${W(7)}" fill="${int}" stroke="${L}" stroke-width="${W(2.5)}"/>`;
    case 'pensativo': return trazo(`M${P(-5, 2)} Q${P(1, -1)} ${P(8, 1)}`);
    case 'triste': return trazo(`M${P(-8, 4)} Q${P(0, -4)} ${P(8, 4)}`);
    case 'confundido': return trazo(`M${P(-10, 1)} L${P(-5, -3)} L${P(0, 2)} L${P(5, -3)} L${P(10, 1)}`, 2.6);
    case 'hipo':
      return `<ellipse cx="${f(mx)}" cy="${f(my + s)}" rx="${W(3.5)}" ry="${W(4.2)}" fill="${int}" stroke="${L}" stroke-width="${W(2.2)}"/>`;
    case 'achis':
      return `<ellipse cx="${f(mx)}" cy="${f(my + 3 * s)}" rx="${W(12)}" ry="${W(9)}" fill="${int}" stroke="${L}" stroke-width="${W(2.5)}"/>`;
    case 'presumido': return trazo(`M${P(-8, 1)} Q${P(2, 6)} ${P(10, -4)}`);
    default: return trazo(`M${P(-7, 0)} Q${P(0, 6)} ${P(7, 0)}`);
  }
}

function mejillas(lx, rx, y, o = {}) {
  const c = o.color ?? '#ff8fab', op = o.op ?? .5;
  return [lx, rx].map((x) =>
    `<ellipse cx="${x}" cy="${y}" rx="9" ry="5" fill="${c}" opacity="${op}"/>`
    + `<path d="M${x - 5} ${y + 2} l3 -4 M${x - 1} ${y + 2} l3 -4 M${x + 3} ${y + 2} l3 -4" stroke="#e45b7f" stroke-width="1.3" stroke-linecap="round" opacity=".7"/>`
  ).join('');
}

// Ojos, cejas, mejillas y boca en un solo paso.
function rostro(g, e, o = {}) {
  const ex = (e === 'normal' && o.base) ? o.base : e;
  const eo = { s: o.s, iris: o.iris, piel: o.piel, linea: o.lineaOjo, blanco: o.blanco, pestanas: o.pestanas };
  return (o.sinMejillas ? '' : mejillas(g.ex1 - 4, g.ex2 + 4, g.mejY, o.mej))
    + ojo(g.ex1, g.ey, ex, -1, eo) + ojo(g.ex2, g.ey, ex, 1, eo)
    + ceja(g.ex1, g.cy, ex, -1, o.ceja) + ceja(g.ex2, g.cy, ex, 1, o.ceja)
    + (o.sinBoca ? '' : boca(g.mx ?? 100, g.my, ex, o.boca));
}

function corazon(cx, cy, r) {
  return `M${cx} ${f(cy + r * .9)} C${f(cx - r * 1.6)} ${f(cy - r * .2)} ${f(cx - r * .9)} ${f(cy - r * 1.3)} ${cx} ${f(cy - r * .45)}`
    + ` C${f(cx + r * .9)} ${f(cy - r * 1.3)} ${f(cx + r * 1.6)} ${f(cy - r * .2)} ${cx} ${f(cy + r * .9)} Z`;
}
function estrella(cx, cy, r) {
  let d = '';
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
    d += (i ? 'L' : 'M') + f(cx + rr * Math.cos(a)) + ' ' + f(cy + rr * Math.sin(a));
  }
  return d + 'Z';
}
function destello(x, y, r, c) {
  return `<path d="M${x} ${y - r} Q${x} ${y} ${x + r} ${y} Q${x} ${y} ${x} ${y + r} Q${x} ${y} ${x - r} ${y} Q${x} ${y} ${x} ${y - r} Z" fill="${c}"/>`;
}
function flor(x, y, c, r = 5) {
  let s = '';
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * 2 * Math.PI / 5;
    s += `<circle cx="${f(x + r * 1.1 * Math.cos(a))}" cy="${f(y + r * 1.1 * Math.sin(a))}" r="${r}" fill="${c}" ${T(1.5)}/>`;
  }
  return s + `<circle cx="${x}" cy="${y}" r="${f(r * .8)}" fill="#ffd23f" ${T(1.5)}/>`;
}

// Chullo andino: gorro con orejeras, franja con rombos y pompón.
function chullo(x0, x1, yTop, yBase, col = {}) {
  const b = col.base ?? '#d6336c', fr = col.franja ?? '#ffd23f', ac = col.acento ?? '#2ec4b6';
  const cx = (x0 + x1) / 2, w = x1 - x0;
  let s = '';
  s += `<path d="M${x0 + 2} ${yBase + 44} L${x0 + 2} ${yBase + 60}" stroke="${fr}" stroke-width="3"/><circle cx="${x0 + 2}" cy="${yBase + 62}" r="4.5" fill="${ac}" ${T(1.6)}/>`;
  s += `<path d="M${x1 - 2} ${yBase + 44} L${x1 - 2} ${yBase + 60}" stroke="${fr}" stroke-width="3"/><circle cx="${x1 - 2}" cy="${yBase + 62}" r="4.5" fill="${ac}" ${T(1.6)}/>`;
  s += `<path d="M${x0 + 2} ${yBase - 6} L${x0 - 8} ${yBase} Q${x0 - 10} ${yBase + 28} ${x0 + 2} ${yBase + 44} L${x0 + 12} ${yBase + 4} Z" fill="${b}" ${T(2.2)}/>`;
  s += `<path d="M${x1 - 2} ${yBase - 6} L${x1 + 8} ${yBase} Q${x1 + 10} ${yBase + 28} ${x1 - 2} ${yBase + 44} L${x1 - 12} ${yBase + 4} Z" fill="${b}" ${T(2.2)}/>`;
  s += `<path d="M${x0} ${yBase} Q${x0 - 2} ${yTop} ${cx} ${yTop - 2} Q${x1 + 2} ${yTop} ${x1} ${yBase} Z" fill="${b}" ${T()}/>`;
  s += `<path d="M${x0 + 1} ${yBase - 14} Q${cx} ${yBase - 26} ${x1 - 1} ${yBase - 14} L${x1} ${yBase} Q${cx} ${yBase - 12} ${x0} ${yBase} Z" fill="${fr}" ${T(2)}/>`;
  for (let i = 1; i <= 5; i++) {
    const x = x0 + w * i / 6, t = (x - cx) / (w / 2), y = yBase - 9 - 6 * (1 - t * t);
    s += `<rect x="${f(x - 3.5)}" y="${f(y - 3.5)}" width="7" height="7" transform="rotate(45 ${f(x)} ${f(y)})" fill="${ac}"/>`;
  }
  for (let i = 0; i < 4; i++) {
    const x = x0 + w * (i + 1.5) / 6, t = (x - cx) / (w / 2), y = yBase - 32 - 8 * (1 - t * t);
    s += `<circle cx="${f(x)}" cy="${f(y)}" r="2.6" fill="#fff" opacity=".85"/>`;
  }
  return s + `<circle cx="${cx}" cy="${yTop - 6}" r="10" fill="${fr}" ${T()}/>`;
}

// Puntos 2D (0-1) del contorno de cada calcomanía; se usan en el SVG y en la nave 3D.
function formaCalcomania(id) {
  const pts = [];
  const radial = (n, r1, r2) => { for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, r = i % 2 ? r2 : r1; pts.push([.5 + r * Math.cos(a), .5 + r * Math.sin(a)]); } };
  if (id === 'estrella') radial(5, .48, .2);

  saltar() {
    if (this.esperandoOpcion) return;
    if (this.actual?.linea.opciones) { this.tocar(); return; }
    cancelAnimationFrame(this.raf);
    Voz.callar();
    const j = this.cola.findIndex((l, k) => k > this.i && l.opciones);
    for (let k = this.i + 1; k < (j === -1 ? this.cola.length : j); k++) {
      const l = this.cola[k];
      this.historial.push({ quien: l.quien, expr: l.expr ?? 'normal', texto: plantilla(l.texto, this.ctx), gris: l.gris });
    }
    this.escribiendo = false;
    if (j === -1) { this.terminar(); return; }
    this.i = j - 1;
    this.siguiente();
  },
  abrirHistorial() {
    const lista = $('#listaHistorial');
    lista.innerHTML = '';
    this.historial.forEach((h) => {
      const li = document.createElement('li');
      li.innerHTML = retrato(h.quien, h.expr, { ...this.ctx, gris: h.gris }) + '<div><b></b><span></span></div>';
      li.querySelector('b').textContent = plantilla(PERSONAJES[h.quien].nombre, this.ctx);
      li.querySelector('span').textContent = h.texto;
      lista.appendChild(li);
    });
    $('#pantallaHistorial').hidden = false;
    lista.scrollTop = lista.scrollHeight;
  },
  ocultarCuadro() { this.el.vn.classList.add('oculta'); $('#avisoOculto').hidden = false; },
  mostrarCuadro() { this.el.vn.classList.remove('oculta'); $('#avisoOculto').hidden = true; },
  terminar() {
    cancelAnimationFrame(this.raf);
    this.escribiendo = false;
    this.activo = false;
    this.actual = null;
    this.el.sig.classList.remove('si');
    this.el.vn.classList.add('oculta');
    $('#avisoOculto').hidden = true;
    const r = this.resolver;
    this.resolver = null;
    r?.();
  },
};

async function escena(id) {
  const lineas = typeof id === 'string' ? GUION[id] : id;
  if (!lineas?.length) return;
  Motor.pausar(true);
  await Dialogo.escena(lineas);
  Motor.pausar(false);
}

};

/* =====================================================================
   12. MOTOR 3D (Three.js)
   Pocas luces, materiales toon, geometrías simples y partículas limitadas.
   ===================================================================== */
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const Motor = {
  pausado: false, bloqueado: false, opciones: [], tweens: [], sacudida: 0, modo: 'inicio',
  velEstrellas: 3, velFactor: 1, vueltas: false, jefe: null, cometa: null, alElegir: null,
  iniciar() {
    const canvas = $('#c3d');
    this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    this.pr = Math.min(window.devicePixelRatio || 1, 1.5);
    this.renderer.setPixelRatio(this.pr);
    this.escena = new THREE.Scene();
    this.escena.background = new THREE.Color('#1b1640');
    this.escena.fog = new THREE.Fog('#1b1640', 45, 125);
    this.camara = new THREE.PerspectiveCamera(55, 1, .1, 220);
    this.camBase = V3(0, .8, 6);
    this.mira = V3(0, .6, -10);
    this.camara.position.copy(this.camBase);
    this.camara.lookAt(this.mira);
    this.escena.add(new THREE.HemisphereLight('#fff0f8', '#4a3a7a', 1.25));
    const sol = new THREE.DirectionalLight('#ffffff', 1.7);
    sol.position.set(4, 6, 8);
    this.escena.add(sol);
    this.css = new CSS2DRenderer({ element: $('#etiquetas') });
    this.grad = new THREE.DataTexture(new Uint8Array([70, 160, 255]), 3, 1, THREE.RedFormat);
    this.grad.minFilter = this.grad.magFilter = THREE.NearestFilter;
    this.grad.needsUpdate = true;
    this.matLinea = new THREE.MeshBasicMaterial({ color: LINEA, side: THREE.BackSide });
    this.mats = new Map();
    this.geoRayo = new THREE.CylinderGeometry(.05, .05, 1, 8, 1, true);
    this.geoRoca = [0, 1, 2].map((s) => this.crearRocaGeo(s * 1.7 + .3));
    this.raycaster = new THREE.Raycaster();
    this.crearFondo();
    this.crearNave();
    this.crearParticulas();
    this.crearEstacion();
    this.reloj = new THREE.Clock();
    this.fps = { n: 0, t: 0 };
    addEventListener('resize', () => this.ajustar());
    this.ajustar();
    canvas.addEventListener('pointerdown', (e) => this.tocarCanvas(e));
    this.renderer.setAnimationLoop(() => this.cuadro());
  },
  ajustar() {
    const w = innerWidth, h = innerHeight;
    this.renderer.setSize(w, h, false);
    this.css.setSize(w, h);
    this.camara.aspect = w / h;
    this.camara.updateProjectionMatrix();
    const dist = this.camBase.z + 9;
    this.mediaAncho = Math.tan(THREE.MathUtils.degToRad(27.5)) * dist * this.camara.aspect;
  },

  /* ---------- Materiales y piezas ---------- */
  mat(color, o = {}) {
    const k = color + JSON.stringify(o);
    if (!this.mats.has(k)) {
      this.mats.set(k, new THREE.MeshToonMaterial({
        color, gradientMap: this.grad,
        transparent: o.opacidad !== undefined, opacity: o.opacidad ?? 1,
      }));
    }
    return this.mats.get(k);
  },
  matUnico(color, o = {}) {
    return new THREE.MeshToonMaterial({ color, gradientMap: this.grad, transparent: o.opacidad !== undefined, opacity: o.opacidad ?? 1 });
  },
  contorno(mesh, k = 1.06) {
    const o = new THREE.Mesh(mesh.geometry, this.matLinea);
    o.scale.setScalar(k);
    o.raycast = () => {};
    mesh.add(o);
    return mesh;
  },
  malla(geo, material, k = 1.06) { return this.contorno(new THREE.Mesh(geo, material), k); },
  crearRocaGeo(s) {
    const g = new THREE.IcosahedronGeometry(1, 1);
    const p = g.attributes.position, v = V3();
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      // desplazamiento que depende solo de la posición: los vértices compartidos siguen unidos
      const k = 1 + .13 * Math.sin(v.x * 3.1 + s) * Math.cos(v.y * 2.7 + s * 2) + .06 * Math.sin(v.z * 5 + s);
      v.multiplyScalar(k);
      p.setXYZ(i, v.x, v.y, v.z);
    }
    g.computeVertexNormals();
    return g;
  },
  crearCara({ sep = .32, y = .12, z = .92, r = .22 } = {}) {
    const c = new THREE.Group();
    const blanco = this.mat('#ffffff'), negro = this.mat('#2a1720');
    const brillo = new THREE.MeshBasicMaterial({ color: '#ffffff' });
    const rubor = new THREE.MeshBasicMaterial({ color: '#ff8fab', transparent: true, opacity: .75 });
    for (const s of [-1, 1]) {
      const ojo = this.malla(new THREE.SphereGeometry(r, 14, 10), blanco, 1.12);
      ojo.position.set(s * sep, y, z);
      const pupila = new THREE.Mesh(new THREE.SphereGeometry(r * .58, 12, 8), negro);
      pupila.position.set(s * sep, y - r * .1, z + r * .55);
      const luz = new THREE.Mesh(new THREE.SphereGeometry(r * .2, 8, 6), brillo);
      luz.position.set(s * sep - r * .25, y + r * .25, z + r * .95);
      const mej = new THREE.Mesh(new THREE.SphereGeometry(r * .6, 10, 8), rubor);
      mej.scale.set(1, .5, .3);
      mej.position.set(s * (sep + r * 1.2), y - r * 1.5, z - .02);
      c.add(ojo, pupila, luz, mej);
    }
    const feliz = new THREE.Mesh(new THREE.TorusGeometry(r * .9, r * .22, 6, 16, Math.PI), negro);
    feliz.rotation.z = Math.PI;
    feliz.position.set(0, y - r * 1.25, z);
    const triste = new THREE.Mesh(new THREE.TorusGeometry(r * .8, r * .22, 6, 16, Math.PI), negro);
    triste.position.set(0, y - r * 2.4, z);
    triste.visible = false;
    c.add(feliz, triste);
    c.userData = { feliz, triste };
    return c;
  },
  carita(cara, triste) { cara.userData.feliz.visible = !triste; cara.userData.triste.visible = triste; },

  /* ---------- Fondo: estrellas, planeta, nebulosa ---------- */
  crearFondo() {
    const N = 700, pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      pos[i * 3] = (Math.random() - .5) * 90;
      pos[i * 3 + 1] = (Math.random() - .5) * 56;
      pos[i * 3 + 2] = -100 + Math.random() * 106;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    this.estrellas = new THREE.Points(geo, new THREE.PointsMaterial({ color: '#ffffff', size: .14, transparent: true, opacity: .9, depthWrite: false }));
    this.escena.add(this.estrellas);

    this.planeta = new THREE.Group();
    this.matPlaneta = this.matUnico('#ff8fc8');
    this.matAnillo = this.matUnico('#ffd23f');
    const esfera = this.malla(new THREE.SphereGeometry(9, 32, 20), this.matPlaneta, 1.025);
    const anillo = new THREE.Mesh(new THREE.TorusGeometry(13.5, .7, 8, 64), this.matAnillo);
    anillo.rotation.set(1.2, .3, 0);
    const luna = this.malla(new THREE.SphereGeometry(1.6, 16, 12), this.mat('#fff3c4'), 1.06);
    luna.position.set(14, 5, 4);
    this.planeta.add(esfera, anillo, luna);
    this.planeta.position.set(-16, 7, -74);
    this.escena.add(this.planeta);

    this.nebulosa = new THREE.Group();
    const colores = ['#b07cff', '#ff7eb3', '#7cc8ff', '#e2a8ff'];
    for (let i = 0; i < 8; i++) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(8 + Math.random() * 8, 16, 12),
        new THREE.MeshBasicMaterial({ color: colores[i % 4], transparent: true, opacity: .12, depthWrite: false, blending: THREE.AdditiveBlending }));
      m.position.set((Math.random() - .5) * 70, (Math.random() - .3) * 30, -70 - Math.random() * 25);
      this.nebulosa.add(m);
    }
    this.escena.add(this.nebulosa);
  },
  colorPlaneta(n, avance) {
    const P = PLANETAS[n] ?? PLANETAS[1];
    const gris = new THREE.Color('#8f8a9c');
    this.matPlaneta.color.copy(gris).lerp(new THREE.Color(P.color), .2 + .8 * avance);
    this.matAnillo.color.copy(gris).lerp(new THREE.Color(P.anillo), .2 + .8 * avance);
  },

  /* ---------- Nave Chaski-1 ---------- */
  crearNave() {
    const g = new THREE.Group();
    this.matNave = this.matUnico('#ff8fb8');
    this.matAlas = this.matUnico('#fff0f3');
    const cuerpo = this.malla(new THREE.CapsuleGeometry(.42, .95, 6, 16), this.matNave, 1.07);
    cuerpo.rotation.x = Math.PI / 2;
    const cabina = this.malla(new THREE.SphereGeometry(.3, 18, 12), this.mat('#9ff0ff', { opacidad: .92 }), 1.08);
    cabina.position.set(0, .3, -.3);
    cabina.scale.set(1, .85, 1.25);
    const ala = (s) => {
      const a = this.malla(new THREE.SphereGeometry(.5, 18, 10), this.matAlas, 1.08);
      a.scale.set(1.5, .16, .7);
      a.position.set(s * .68, -.05, .2);
      a.rotation.z = s * .12;
      return a;
    };
    const aleta = this.malla(new THREE.ConeGeometry(.16, .5, 10), this.matNave, 1.1);
    aleta.position.set(0, .45, .55);
    aleta.rotation.x = .4;
    const motor = this.malla(new THREE.CylinderGeometry(.24, .3, .3, 14), this.mat('#5b4a7a'), 1.08);
    motor.rotation.x = Math.PI / 2;
    motor.position.set(0, 0, .82);
    this.llama = new THREE.Mesh(new THREE.ConeGeometry(.2, .6, 12), new THREE.MeshBasicMaterial({ color: '#ffb23f', transparent: true, opacity: .9 }));
    this.llama.rotation.x = -Math.PI / 2;
    this.llama.position.set(0, 0, 1.25);
    this.calcos = new THREE.Group();
    g.add(cuerpo, cabina, ala(-1), ala(1), aleta, motor, this.llama, this.calcos);
    this.naveBase = V3(0, -1.42, .6);
    this.naveY = this.naveBase.y;
    g.position.copy(this.naveBase);
    g.scale.setScalar(.85);
    this.nave = g;
    this.escena.add(g);
  },
  pintarNave(nave) {
    this.matNave.color.set(nave?.color ?? COLORES_NAVE[0].color);
    this.coloresEstela = (ESTELAS.find((e) => e.id === nave?.estela) ?? ESTELAS[0]).colores;
    this.llama.material.color.set(this.coloresEstela[0]);
    this.calcos.clear();
    const lugares = [[-.75, .05, .22, .5], [.75, .05, .22, .5], [0, .43, .42, .36]];
    (nave?.calcomanias ?? []).slice(0, 3).forEach((id, i) => {
      const c = CALCOMANIAS.find((x) => x.id === id);
      if (!c) return;
      const [x, y, z, s] = lugares[i];
      const forma = new THREE.Shape(formaCalcomania(id).map(([px, py]) => new THREE.Vector2((px - .5) * s, -(py - .5) * s)));
      const m = new THREE.Mesh(new THREE.ShapeGeometry(forma), new THREE.MeshBasicMaterial({ color: c.color, side: THREE.DoubleSide }));
      m.rotation.x = -Math.PI / 2;
      m.position.set(x, y, z);
      this.calcos.add(m);
    });
  },

  /* ---------- Estación espacial ---------- */
  crearEstacion() {
    const g = new THREE.Group();
    const centro = this.malla(new THREE.SphereGeometry(1.6, 24, 16), this.mat('#fff0f3'));
    const anillo = this.malla(new THREE.TorusGeometry(3.6, .45, 10, 48), this.mat('#ff9fc0'), 1.08);
    anillo.rotation.x = Math.PI / 2;
    g.add(centro, anillo);
    for (let i = 0; i < 4; i++) {
      const r = this.malla(new THREE.CylinderGeometry(.12, .12, 3.6, 8), this.mat('#c4e9f5'), 1.15);
      r.rotation.z = Math.PI / 2;
      r.rotation.y = i * Math.PI / 2;
      r.position.set(Math.cos(i * Math.PI / 2) * 1.8, 0, -Math.sin(i * Math.PI / 2) * 1.8);
      g.add(r);
    }
    for (const s of [-1, 1]) {
      const panel = this.malla(new THREE.BoxGeometry(2.6, .08, 1.1), this.mat('#7cb8ff'), 1.05);
      panel.position.set(s * 5.6, 0, 0);
      g.add(panel);
    }
    const antena = this.malla(new THREE.CylinderGeometry(.08, .08, 1.6, 6), this.mat('#c4e9f5'), 1.2);
    antena.position.y = 2.2;
    const bola = this.malla(new THREE.SphereGeometry(.3, 12, 8), this.mat('#ffd23f'));
    bola.position.y = 3.1;
    g.add(antena, bola);
    const luz = new THREE.MeshBasicMaterial({ color: '#fff6a8' });
    for (let i = 0; i < 10; i++) {
      const v = new THREE.Mesh(new THREE.SphereGeometry(.14, 8, 6), luz);
      const a = i / 10 * Math.PI * 2;
      v.position.set(Math.cos(a) * 3.6, .42, Math.sin(a) * 3.6);
      g.add(v);
    }
    g.position.set(0, 1.4, -14);
    g.rotation.x = .35;
    g.visible = false;
    this.estacion = g;
    this.escena.add(g);
  },

  /* ---------- Modos de cámara ---------- */
  modoInicio() {
    this.modo = 'inicio';
    this.limpiarTodo();
    this.estacion.visible = false;
    this.planeta.visible = true;
    this.nebulosa.visible = true;
    this.colorPlaneta(1, 1);
    this.nave.position.set(this.camara.aspect > 1.2 ? 3.4 : 0, -.6, .5);
    this.naveY = -.6;
    this.nave.rotation.set(0, 0, 0);
    this.velEstrellas = 3;
  },
  modoVuelo(n, avance = 0) {
    this.modo = 'vuelo';
    this.estacion.visible = false;
    this.planeta.visible = n !== 5;
    this.nebulosa.visible = n === 5;
    this.colorPlaneta(n, avance);
    this.nave.position.copy(this.naveBase);
    this.naveY = this.naveBase.y;
    this.nave.rotation.set(0, 0, 0);
    this.velFactor = CONFIG.velocidad[n] * (AJUSTES.modoApoyo ? .7 : 1);
    this.vueltas = n >= 3;
    this.velEstrellas = 13 * this.velFactor;
  },
  modoEstacion() {
    this.modo = 'estacion';
    this.limpiarTodo();
    this.estacion.visible = true;
    this.planeta.visible = false;

  /* ---------- Opciones: asteroides con palabras o portales ---------- */
  lanzarOpciones(preg) {
    this.quitarOpciones(false);

    const n = preg.opciones.length;
    const ancho = Math.max(2.6, Math.min(5.6, this.mediaAncho - 2.8));
    const desorden = Math.floor(Math.random() * 5);
    preg.opciones.forEach((op, i) => {
      const x = n === 1 ? 0 : -ancho + (2 * ancho) * i / (n - 1);
      const y = (i % 2 === 0 ? 1.55 : -.35) + Math.random() * .25 - (this.jefe ? .7 : 0);
      const a = this.crearAsteroide(op, i, desorden);
      a.hasta = V3(x, y, -9 - (i % 2) * .5);
      a.desde = V3(x * 2.2 + (Math.random() - .5) * 6, y + (Math.random() - .5) * 4, -72);

  etiqueta(texto, clase, op, a) {

      const remolino = new THREE.Mesh(new THREE.RingGeometry(.3, 1.15, 32, 1, 0, Math.PI * 1.4), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: .35, side: THREE.DoubleSide }));

      g.add(aro, disco, remolino, hit);

      a.div = this.etiqueta('', `etiqueta portal ${l.clase} apagada`, l.op, a);

      hit.userData.opcion = a;
      a.hasta = V3(l.x, .9, -9);
      a.desde = V3(l.x * 1.8, .9, -60);
      a.dur = (RAPIDO ? .4 : 2.4) / this.velFactor;
      g.position.copy(a.desde);

      this.opciones.push(a);
    });
    const c = new THREE.Group();
    const bola = this.malla(new THREE.SphereGeometry(.45, 16, 12), this.mat('#fff3a8'), 1.1);
    const cola = new THREE.Mesh(new THREE.ConeGeometry(.42, 2.4, 12, 1, true), new THREE.MeshBasicMaterial({ color: '#ffd23f', transparent: true, opacity: .4, blending: THREE.AdditiveBlending, depthWrite: false }));
    cola.rotation.x = -Math.PI / 2;

    c.add(et);
    c.position.set(0, 2.2, -50);
    this.escena.add(c);

  },
  elegir(a) {
    if (this.bloqueado || this.pausado || !this.alElegir) return;
    if (!['flotando', 'resaltado', 'pasando'].includes(a.estado) && !(a.estado === 'llegando' && a.t > .55)) return;

  tocarCanvas(e) {
    if (!this.opciones.length) return;
    const r = this.renderer.domElement.getBoundingClientRect();
    const p = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    this.raycaster.setFromCamera(p, this.camara);
    const hits = this.raycaster.intersectObjects(this.opciones.filter((a) => a.estado !== 'fuera').map((a) => a.hit), false);
    if (hits.length) this.elegir(hits[0].object.userData.opcion);
  },
  async quitarOpciones(animado = true) {
    const viejas = this.opciones;
    this.opciones = [];
    const cometa = this.cometa;
    this.cometa = null;
    if (!animado) { viejas.forEach((a) => this.quitar(a.grupo)); if (cometa) this.quitar(cometa.grupo); return; }
    viejas.forEach((a) => { a.div.classList.add('apagada'); a.salida = a.grupo.position.clone(); });
    if (cometa) cometa.div.classList.add('apagada');
    await this.animar(450, (t) => viejas.forEach((a) => {
      a.grupo.position.set(a.salida.x * (1 + t * 1.5), a.salida.y + t * 6, a.salida.z - t * 10);
      a.grupo.scale.setScalar(Math.max(.01, 1 - t));

    viejas.forEach((a) => this.quitar(a.grupo));
    if (cometa) this.quitar(cometa.grupo);

  /* ---------- Efectos ---------- */
  animar(ms, fn, ease = (x) => x) {
    return new Promise((res) => this.tweens.push({ ini: performance.now(), dur: RAPIDO ? Math.min(ms, 50) : ms, fn, ease, res }));
  },
  disparar(destino) {
    Sonido.efecto('disparo');
    const origen = this.nave.position.clone().add(V3(0, .1, -.9));
    const dir = destino.clone().sub(origen), len = dir.length(), u = dir.clone().normalize();
    const g = new THREE.Group();
    const nucleo = new THREE.Mesh(this.geoRayo, new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    const halo = new THREE.Mesh(this.geoRayo, new THREE.MeshBasicMaterial({ color: '#7ff6ff', transparent: true, opacity: .55, blending: THREE.AdditiveBlending, depthWrite: false }));
    halo.scale.set(3.4, 1, 3.4);
    g.add(nucleo, halo);
    g.position.copy(origen).addScaledVector(dir, .5);
    g.quaternion.setFromUnitVectors(V3(0, 1, 0), u);
    g.scale.set(1, len, 1);
    // ondas de voz a lo largo del rayo
    const ondas = new THREE.Group();
    const matOnda = new THREE.MeshBasicMaterial({ color: '#b6fbff', transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
    for (const k of [.3, .55, .8]) {
      const o = new THREE.Mesh(new THREE.TorusGeometry(.3, .035, 6, 24), matOnda);
      o.position.copy(origen).addScaledVector(dir, k);
      o.quaternion.setFromUnitVectors(V3(0, 0, 1), u);
      ondas.add(o);
    }
    this.escena.add(g, ondas);
    this.nave.rotation.z = THREE.MathUtils.clamp(-destino.x * .05, -.35, .35);
    this.emitir(origen, 8, ['#7ff6ff', '#ffffff'], { rapidez: 2, vida: .3 });
    this.animar(340, (t) => {
      nucleo.material.opacity = 1 - t;
      halo.material.opacity = .55 * (1 - t);
      matOnda.opacity = 1 - t;
      ondas.children.forEach((o, i) => o.scale.setScalar(1 + t * (2 + i)));
    }).then(() => {
      this.escena.remove(g, ondas);
      nucleo.material.dispose(); halo.material.dispose(); matOnda.dispose();
      ondas.children.forEach((o) => o.geometry.dispose());
    });
    return esperar(150);
  },
  onda(pos, color = '#fff6a8') {
    const m = new THREE.Mesh(new THREE.TorusGeometry(1, .08, 6, 40), new THREE.MeshBasicMaterial({ color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    m.position.copy(pos);
    m.lookAt(this.camara.position);
    this.escena.add(m);
    this.animar(600, (t) => { m.scale.setScalar(1 + t * 3); m.material.opacity = 1 - t; }).then(() => { this.escena.remove(m); m.geometry.dispose(); m.material.dispose(); });
  },
  async acierto(a) {
    a.estado = 'fuera';
    a.div.classList.add('ok');
    if (a.cara) this.carita(a.cara, false);
    const pos = a.grupo.position.clone();
    Sonido.efecto('acierto');
    if (a.esPortal && this.cometa) {
      const c = this.cometa, desde = c.grupo.position.clone();
      c.div.classList.add('apagada');
      await this.animar(450, (t) => { c.grupo.position.lerpVectors(desde, pos, t); c.grupo.scale.setScalar(1 - t * .8); }, (x) => x * x);
      this.quitar(c.grupo);
      this.cometa = null;
    }
    Sonido.efecto('explosion');
    this.emitir(pos, this.calidadBaja ? 24 : 46, ['#ff7aa8', '#ffd23f', '#7ff6ff', '#b07cff', '#7fdca2'], { rapidez: 6, vida: 1.1 });
    this.onda(pos);
    if (!a.esPortal) {
      await this.animar(200, (t) => a.grupo.scale.setScalar(1 + t * .4));
      this.quitar(a.grupo);
      this.opciones = this.opciones.filter((x) => x !== a);
    }
    return pos;
  },
  error(a) {
    a.div.classList.add('mal');
    if (a.cara) { this.carita(a.cara, true); a.roca.material = this.mat('#9a96a6', { plano: true }); }
    Sonido.efecto('error');
    this.sacudida = .3;
    const x0 = a.grupo.position.x;
    this.emitir(a.grupo.position, 12, ['#9a96a6', '#c9c5d3'], { rapidez: 2.5, vida: .6 });
    return this.animar(450, (t) => { a.grupo.position.x = x0 + Math.sin(t * Math.PI * 6) * .25 * (1 - t); });
  },
  resaltar(a) { a.estado = 'resaltado'; a.div.classList.add('ok'); },
  descartar(a) {
    Sonido.efecto('escaner');
    a.estado = 'fuera';
    a.div.classList.add('apagada');
    this.emitir(a.grupo.position, 16, ['#bff3ff', '#9a96a6'], { rapidez: 3, vida: .6 });
    this.animar(400, (t) => a.grupo.scale.setScalar(Math.max(.01, 1 - t))).then(() => this.quitar(a.grupo));
    this.opciones = this.opciones.filter((x) => x !== a);
  },
  aPantalla(v) {
    const p = v.clone().project(this.camara);

  },
  volarPalabra(texto, pos) {
    const ini = this.aPantalla(pos.clone().add(V3(0, -1.5, 0)));
    const destino = $('#cofre').getBoundingClientRect();
    const el = html(`<div class="palabra-vuela">${esc(texto)}</div>`);

    el.style.top = `${ini.y - el.offsetHeight / 2}px`;

  flotante(texto, pos) {
